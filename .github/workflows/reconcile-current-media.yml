name: One-time current media reconciliation
on:
  push:
    branches: [docs/reconcile-three-kb-images-20260908]
    paths: ['.github/workflows/reconcile-current-media.yml']
permissions:
  contents: write
jobs:
  reconcile:
    if: github.repository == 'ginosega/fishing' && github.ref == 'refs/heads/docs/reconcile-three-kb-images-20260908'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/reconcile-three-kb-images-20260908
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile current media records
        run: |
          set -euo pipefail
          node --check tools/reconcile-current-media.mjs
          node tools/reconcile-current-media.mjs
          node pwa/dagger-axis.test.mjs
          node pwa/accepted-2026-09-08.test.mjs
      - name: Commit source-independent documentation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md Fishing_Context.md Fishing_TODO.md Fishing_Decision_Log.md Fishing_New_Chat_Bootstrap_Prompt.md pwa/README.md pwa/DAGGER_AXIS_RELEASE_2026-09-08.md pwa/RELEASE_2026-09-08_KAYAK_KB_IMAGES.md
          git diff --cached --check
          git commit -m 'Reconcile latest image replacements and durable regression policy'
          git push origin HEAD:refs/heads/docs/reconcile-three-kb-images-20260908
