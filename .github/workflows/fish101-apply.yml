name: FISH101 validate and apply knot packages

on:
  push:
    branches:
      - feature/fish101-knot-batch

permissions:
  contents: write

jobs:
  validate-apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard exact current main
        run: |
          test "$(git rev-parse origin/main)" = "a087b4f5be6a0702e71d29c17efc1bb3576eda93"
      - name: Validate submitted packages and apply requested canonical changes
        run: |
          python .github/scripts/fish101-apply.py
          git diff --check
          git diff --name-only | sort > /tmp/fish101-expected.txt
          test "$(wc -l < /tmp/fish101-expected.txt)" -eq 8
          grep -Fx 'KB/kb.json' /tmp/fish101-expected.txt
          grep -Fx 'KB/Knots/content/improved-clinch.md' /tmp/fish101-expected.txt
          grep -Fx 'KB/Knots/content/modified-uni.md' /tmp/fish101-expected.txt
          grep -Fx 'KB/Knots/content/loop-non-slip-loop.md' /tmp/fish101-expected.txt
          grep -Fx 'KB/Knots/content/palomar.md' /tmp/fish101-expected.txt
          grep -Fx 'KB/Knots/content/trilene.md' /tmp/fish101-expected.txt
          test "$(git diff --name-status | awk '$1=="D"{n++} END{print n+0}')" -eq 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - name: Run source tests and deterministic production verification
        working-directory: pwa
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build -- --base=/fishing/
          npm run verify
      - name: Commit only requested source changes
        run: |
          rm .github/scripts/fish101-apply.py
          rm .github/workflows/fish101-apply.yml
          git add -A
          git diff --cached --check
          git diff --cached --name-only | grep -v '^\.github/scripts/fish101-apply.py$' | grep -v '^\.github/workflows/fish101-apply.yml$' | sort > /tmp/fish101-staged.txt
          diff -u /tmp/fish101-expected.txt /tmp/fish101-staged.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "FISH101: update knot guidance and sequences"
          git push origin HEAD:${GITHUB_REF_NAME}
