name: FISH099 package validation and apply

on:
  push:
    branches:
      - feature/fish099-knot-content-sequences

permissions:
  contents: write

jobs:
  validate-and-apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate package base ancestry
        run: |
          git merge-base --is-ancestor 65ac208dbb1a116cc321d5b13bea1228b3d1ee6f HEAD
          test "$(git rev-parse origin/main)" = "9012fb6348307499a77640c3053f473cd26e9830"

      - name: Validate all package bases and uploaded image bytes, then apply canonical changes
        run: node .github/scripts/fish099-apply.mjs

      - name: Update release-integrity count fixtures for the added Bowline record
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pwa/test/core.test.mjs')
          s=p.read_text()
          replacements={
            '[69,56,5]':'[69,57,5]',
            'maps.kb.size,56':'maps.kb.size,57',
            'validateLibraryPaths(data).size,106':'validateLibraryPaths(data).size,107',
            'result.references.length,236':'result.references.length,237',
          }
          for old,new in replacements.items():
            if old not in s: raise SystemExit(f'missing expected fixture: {old}')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY

      - name: Run source tests
        working-directory: pwa
        run: |
          npm ci
          npm test

      - name: Commit only the canonical package changes and remove temporary validator
        run: |
          rm .github/scripts/fish099-apply.mjs
          rm .github/workflows/fish099-apply-knot-packages.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "FISH099: apply knot content and sequences"
          git push origin HEAD:${GITHUB_REF_NAME}
