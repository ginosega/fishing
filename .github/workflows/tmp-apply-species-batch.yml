name: Temporary apply Species batch
on:
  push:
    branches: [feature/species-picture-content-batch-20260910]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Verify packages and apply exact changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json, hashlib

          def sha_bytes(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          def canonical(v):
              if isinstance(v, dict):
                  return '{' + ','.join(json.dumps(k,separators=(',',':')) + ':' + canonical(v[k]) for k in sorted(v)) + '}'
              if isinstance(v, list):
                  return '[' + ','.join(canonical(x) for x in v) + ']'
              return json.dumps(v,separators=(',',':'))
          def fp(v):
              return hashlib.sha256(canonical(v).encode()).hexdigest()

          expected_images = {
            'KB/Species/assets/Kokanee.png': (1315235,'0d049c81a5d88478c04559e46d5875ca2a996d081318b2fb4738b0cf5724b91b'),
            'KB/Species/assets/largemouth-bass.png': (444848,'5b4a88bc9ca753a04534c057c2e94af235c1ac77f30742343c4bb94e7723a3c2'),
            'KB/Species/assets/smallmouth-bass.png': (512570,'9777ed8297638164ca51613f21cbd20fb247dd39d3c9aa2b8839ed58243d94a8'),
          }
          for path,(size,digest) in expected_images.items():
              p=Path(path)
              assert p.is_file(), f'missing image: {path}'
              assert p.stat().st_size == size, (path,p.stat().st_size,size)
              actual=sha_bytes(path)
              assert actual == digest, (path,actual,digest)

          expected_notes = {
            'KB/Species/content/kokanee.md':'3d3db1a82b35b35b87c421ae023ffa015fd171e8af7565b30607ebf1664b1aa6',
            'KB/Species/content/largemouth-bass.md':'7c80437fc258876b41646b92731e6874508797a404b79354a27ba1382bc8efa0',
            'KB/Species/content/smallmouth-bass.md':'c17ca1163bf726c83a5df1f924624f3dc0c683f18ec76f4f4e0be0a00968c76f',
          }
          for path,digest in expected_notes.items():
              actual=sha_bytes(path)
              assert actual == digest, (path,actual,digest)

          kb_path=Path('KB/kb.json')
          data=json.loads(kb_path.read_text())
          byid={x['id']:x for x in data['entities']}
          expected_records={
            'species-kokanee':'0052f9de4e04b3c596fe23b5870b7c0f89cb11db1920b5f2b963b9c9846e161d',
            'species-largemouth-bass':'d69cd40347c1caf33167bed3216b574679186a4bc20c4118abf9449f23a29017',
            'species-smallmouth-bass':'c789ed382bc8c6703156709fb553f02fbfa00f7aab1685ccd6d544b254b0386c',
          }
          for rid,digest in expected_records.items():
              actual=fp(byid[rid])
              assert actual == digest, (rid,actual,digest)

          byid['species-kokanee']['picture']={
            'src':'KB/Species/assets/Kokanee.png',
            'caption':'Kokanee shown in non-spawning (silver) and spawning (red) phases'
          }
          byid['species-smallmouth-bass']['description']='Structure-oriented target'
          kb_path.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')

          Path('KB/Species/content/kokanee.md').write_text('Kokanee are treated as a specialized target. Current regulations and water-specific information must be checked before keeping.\n')
          Path('KB/Species/content/largemouth-bass.md').write_text('Largemouth bass are a primary target in shallow vegetation, docks, protected water, and cover-oriented areas. Current location and technique pages contain the detailed water-specific and presentation guidance.\n\nVideo: [Life of the Largemouth Bass](https://youtu.be/dNG8z_IxlJ0?si=hnJsjq8gUNrOVAal)\n')
          Path('KB/Species/content/smallmouth-bass.md').write_text('Video: [Life of the Smallmouth Bass](https://youtu.be/nwKE-44BPCU?si=PHduWR0AdRj66g1m)\n')

          verifier=Path('pwa/tools/verify-hosted.mjs')
          s=verifier.read_text()
          old="await page.goto(root+'#/kb/species-perch');await page.getByRole('heading',{name:'Yellow Perch',exact:true}).waitFor();assert.equal(await page.locator('.picture-empty').count(),0);"
          new="await page.goto(root+'#/kb/species-perch');await page.getByRole('heading',{name:'Yellow Perch',exact:true}).waitFor();await page.locator('.picture img').waitFor();assert.equal(await page.locator('.picture img').count(),1);assert.equal(await page.locator('.picture-empty').isVisible(),false);"
          assert s.count(old)==1, f'expected one stale hosted Perch verifier assertion, found {s.count(old)}'
          verifier.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git diff -- KB/kb.json KB/Species/content/kokanee.md KB/Species/content/largemouth-bass.md KB/Species/content/smallmouth-bass.md pwa/tools/verify-hosted.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add KB/kb.json KB/Species/content/kokanee.md KB/Species/content/largemouth-bass.md KB/Species/content/smallmouth-bass.md pwa/tools/verify-hosted.mjs
          git commit -m 'Apply Species picture and content updates'
          git push origin HEAD:${GITHUB_REF_NAME}
