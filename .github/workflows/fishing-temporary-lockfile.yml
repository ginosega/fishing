name: Temporary security lockfile generation (DO NOT MERGE)
on:
  pull_request:
    paths:
      - '.github/workflows/fishing-temporary-lockfile.yml'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Generate verified patch-version lockfile on an isolated PR runner
        working-directory: pwa
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact dompurify@3.4.17 markdown-it@15.0.3
          npm update fast-uri --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          node - <<'NODE'
          const fs=require('node:fs');
          for(const [n,filename] of [['PKG','package.json'],['LOCK','package-lock.json']]){
           const lines=fs.readFileSync(filename,'utf8').split('\n');
           for(let i=0;i<lines.length;i++)console.log('RELEASE_'+n+'_LINE_'+i+':'+lines[i]);
           console.log('RELEASE_'+n+'_TOTAL_'+lines.length);
          }
          NODE
