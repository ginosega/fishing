name: FISH103 hosted verifier fix
on:
  push:
    branches: [fix/fish103-hosted-verifier-dialog]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply expected dirty-editor dialog handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pwa/tools/verify-hosted.mjs')
          s=p.read_text()
          old="  report.fish096='Hosted Add Knot sequence selection, local sequence preview, ordered package metadata and exact per-Knot GitHub upload link passed; no repository write performed';\n  await page.goto(root+'#/inventory/item/daiwa-tatula-xt-rod');"
          new="  report.fish096='Hosted Add Knot sequence selection, local sequence preview, ordered package metadata and exact per-Knot GitHub upload link passed; no repository write performed';\n  page.once('dialog',dialog=>dialog.accept());await page.goto(root+'#/inventory/item/daiwa-tatula-xt-rod');"
          if old not in s:
              raise SystemExit(0)
          p.write_text(s.replace(old,new,1))
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name "Gino Sega"
          git config user.email "ginosega@gmail.com"
          git add pwa/tools/verify-hosted.mjs
          git commit -m "FISH103: accept expected hosted navigation guard"
          git push origin HEAD:fix/fish103-hosted-verifier-dialog
