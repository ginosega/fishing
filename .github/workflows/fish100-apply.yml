name: FISH100 Palomar package validation and apply

on:
  push:
    branches:
      - feature/fish100-palomar-notes

permissions:
  contents: write

jobs:
  validate-and-apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate package ancestry and exact current main
        run: |
          git merge-base --is-ancestor 4bd0d4694490b93c19bb910736dff0bc868b648e HEAD
          test "$(git rev-parse origin/main)" = "860f85d3dde48282571279f5f75519b1802a74ee"
      - name: Validate package bases and apply exact Markdown replacement
        run: node .github/scripts/fish100-apply.mjs
      - name: Run source tests
        working-directory: pwa
        run: |
          npm ci
          npm test
      - name: Commit only canonical requested change and remove temporary helpers
        run: |
          rm .github/scripts/fish100-apply.mjs
          rm .github/workflows/fish100-apply.yml
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "KB/Knots/content/palomar.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "FISH100: update Palomar knot notes"
          git push origin HEAD:${GITHUB_REF_NAME}
