name: Fishing cache hotfix integration
on:
  push:
    branches:
      - fix/gear-module-cache-regression
    paths:
      - '.github/workflows/fishing-cache-hotfix-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gear-module-cache-regression
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate and validate cache hotfix
        run: |
          node pwa/apply-cache-hotfix.mjs
          node --check pwa/build.mjs
          node pwa/runtime-versioning.test.mjs
      - name: Commit source integration
        run: |
          git config user.name "Fishing Project"
          git config user.email "actions@users.noreply.github.com"
          git add pwa/build.mjs
          git commit -m "Integrate versioned runtime modules into build"
          git push origin HEAD:fix/gear-module-cache-regression
