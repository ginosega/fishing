name: One-time PR39 documentation reconciliation

on:
  push:
    branches:
      - docs/reconcile-pr39-authored-notes-20260904

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply documentation reconciliation if present
        run: |
          if [ -f reconcile-pr39-docs-once.mjs ]; then
            python - <<'PY'
          from pathlib import Path
          p = Path('reconcile-pr39-docs-once.mjs')
          s = p.read_text()
          s = s.replace('Markdown (`gear-content/<gear-id>.md`, `catch-content/<catch-id>.md`)', 'Markdown (\\`gear-content/<gear-id>.md\\`, \\`catch-content/<catch-id>.md\\`)')
          p.write_text(s)
          PY
            node reconcile-pr39-docs-once.mjs
          fi
      - name: Commit reconciled documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Reconcile durable state after PR #39"
            git push origin HEAD:docs/reconcile-pr39-authored-notes-20260904
          fi
