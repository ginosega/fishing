name: FISH100 final project-state reconciliation

on:
  push:
    branches:
      - docs/fish100-closeout-final

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact current main and reconcile records
        run: |
          test "$(git rev-parse origin/main)" = "52afc4335445706fa07d210dd8f3f2823e9636eb"
          python .github/scripts/fish100-closeout-final.py
      - name: Commit only authoritative record changes
        run: |
          rm .github/scripts/fish100-closeout-final.py
          rm .github/workflows/fish100-closeout-final.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Docs: close out FISH100 on current production"
          test "$(git diff --name-only origin/main...HEAD | sort | tr '\n' ' ')" = "Fishing_Context.md Fishing_Decision_Log.md Fishing_New_Chat_Bootstrap_Prompt.md Fishing_TODO.md README.md pwa/README.md "
          git push origin HEAD:${GITHUB_REF_NAME}
