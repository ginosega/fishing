name: Fishing RVR119 content integration
on:
  push:
    branches:
      - content/add-bonafide-rvr119
    paths:
      - '.github/workflows/fishing-rvr119-import.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/add-bonafide-rvr119
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and validate exact Gear handoff
        run: |
          node pwa/import-bonafide-rvr119.mjs
          node --check pwa/gear-model.test.mjs
          node --check pwa/final-content.test.mjs
          node pwa/gear-model.test.mjs
          node pwa/final-content.test.mjs
          node pwa/my-gear-routing.test.mjs
      - name: Commit integrated source
        run: |
          git config user.name "Fishing Project"
          git config user.email "actions@users.noreply.github.com"
          git add pwa/data/gear.seed.json pwa/gear-model.test.mjs pwa/final-content.test.mjs .github/workflows/fishing-pwa-build.yml
          git commit -m "Add Bonafide RVR119 structured Gear record"
          git push origin HEAD:content/add-bonafide-rvr119
