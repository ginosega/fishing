name: One-time Cranberry release preparation
on:
  push:
    branches:
      - feature/cranberry-lake-picture-20260908
    paths:
      - .github/workflows/cranberry-release-preparation.yml
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.head_commit.message == 'Finish Cranberry regression preparation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Include remaining executable version gates
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import assert from 'node:assert/strict';
          const p='.release-work/prepare-cranberry.mjs';
          let s=await fs.readFile(p,'utf8');
          const line=s.split('\n').find(x=>x.includes('Obsolete KB version remains in executable file:'));
          assert.ok(line && line.includes('assert.ok(!text.includes(oldVersion)'));
          s=s.replace(line,"   if(text.includes(oldVersion) && entry.name.endsWith('.test.mjs')) { await write(p,text.replaceAll(oldVersion,newVersion)); continue; }\n   "+line.trim());
          await fs.writeFile(p,s);
          NODE
          node .release-work/prepare-cranberry.mjs
      - name: Check syntax and source models
        run: |
          node --check pwa/accepted-2026-09-08.test.mjs
          node --check pwa/accepted-2026-09-08-joyride-caption.test.mjs
          node --check pwa/cranberry-lake-picture.test.mjs
          node pwa/gear-model.test.mjs
          node pwa/kb-model.test.mjs
          node pwa/cranberry-lake-picture.test.mjs
          node pwa/accepted-2026-09-08.test.mjs
          node pwa/accepted-2026-09-08-joyride-caption.test.mjs
          node pwa/final-content.test.mjs
      - name: Commit validated preparation and remove one-time machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pwa/*.test.mjs .github/workflows/fishing-pwa-build.yml
          git rm .github/workflows/cranberry-release-preparation.yml
          git rm -r -f .release-work
          git diff --cached --check
          git commit -m 'Validate Cranberry picture and preserve mutable user media'
          git push origin HEAD:feature/cranberry-lake-picture-20260908
