name: FISH107 one-shot type helper

on:
  push:
    branches:
      - feature/fish107-skylety-type

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct Skylety type
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('pwa/Gear/gear.json')
          text = path.read_text(encoding='utf-8')
          old = '''      "id": "skylety-fishing-hook-sharpener",
      "name": "Skylety Fishing Hook Sharpener",
      "category": "accessories",
      "type": "Kayaks",'''
          new = '''      "id": "skylety-fishing-hook-sharpener",
      "name": "Skylety Fishing Hook Sharpener",
      "category": "accessories",
      "type": "Tools",'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/fish107-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pwa/Gear/gear.json
          git commit -m "FISH107: correct Skylety type to Tools"
          git push origin HEAD:feature/fish107-skylety-type
