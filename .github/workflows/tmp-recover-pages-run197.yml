name: Temporary Pages Recovery Run 197

on:
  push:
    branches:
      - ops/recover-pages-run197
    paths:
      - .github/workflows/tmp-recover-pages-run197.yml

permissions:
  actions: write
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale Pages artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE repos/$GITHUB_REPOSITORY/actions/artifacts/10358735829
          gh api -X DELETE repos/$GITHUB_REPOSITORY/actions/artifacts/10358164404
      - name: Rerun failed deployment job
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/$GITHUB_REPOSITORY/actions/jobs/104064608735/rerun
