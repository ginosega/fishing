name: FISH097 Closeout Consistency Polish
on:
  push:
    branches: [docs/fish097-closeout]
    paths: [.github/workflows/fish097-doc-polish.yml]
permissions:
  contents: write
jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/fish097-closeout
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changes={
            'Fishing_Context.md': [('do not restart completed FISH096 release work.', 'do not restart completed FISH096 or FISH097 release work.')],
            'Fishing_TODO.md': [('Do not reopen FISH096 or P2 work without an explicit new user request.', 'Do not reopen FISH096/FISH097 or P2 work without an explicit new user request.')],
            'Fishing_Decision_Log.md': [('FISH096 does not change this decision.', 'FISH096/FISH097 do not change this decision.')],
          }
          for name,repls in changes.items():
              p=Path(name); t=p.read_text(encoding='utf-8')
              for old,new in repls:
                  assert t.count(old)==1, (name, old, t.count(old))
                  t=t.replace(old,new,1)
              p.write_text(t,encoding='utf-8',newline='')
          Path('.github/workflows/fish097-doc-polish.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Fishing_Context.md Fishing_TODO.md Fishing_Decision_Log.md .github/workflows/fish097-doc-polish.yml
          git diff --cached --check
          git commit -m "Docs: Finalize FISH097 continuation wording"
          git push origin HEAD:docs/fish097-closeout
