# V3 source validation. V2 is frozen; no legacy deploy or publication lanes.
# Every application PR runs a single fast source check. A full browser pass
# is operator-triggered only for final V3 pre-release acceptance.
name: Fishing Companion V3 validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fishing-v3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-fast:
    name: v3-fast-checks
    # Governance docs have their own protected governance-docs check.
    if: github.event_name == 'pull_request' && github.base_ref != 'governance/project-ops'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - name: Test source, build approved V3 UI once, verify
        working-directory: pwa
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build -- --d6-reader-candidate --d6-owner-connection-candidate --d6-owner-editor-preview --d6-wp2-hosted-candidate --d6-direct-gear-save --base=/fishing/ --out=dist-v3-check --source-revision="$SOURCE_REVISION"
          node tools/verify.mjs --out=dist-v3-check

  validate-release:
    name: v3-release-acceptance
    # Manual, pre-release only. Does not publish, migrate, or deploy.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - name: Final V3 source, security and Chromium browser acceptance
        working-directory: pwa
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm test
          npm run build -- --d6-reader-candidate --d6-owner-connection-candidate --d6-owner-editor-preview --base=/fishing/ --out=dist-v3-acceptance --source-revision="$GITHUB_SHA"
          node tools/verify.mjs --out=dist-v3-acceptance
          FISHING_D6_OWNER_EDITOR_DIST=dist-v3-acceptance npx playwright test test/d6-owner-editor-preview.spec.mjs --project=chromium
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v3-release-acceptance-evidence
          path: pwa/.test-output/
          if-no-files-found: ignore
          retention-days: 14

  merge-ready:
    name: fishing-merge-ready
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [validate-fast]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail closed on missing or failed required checks
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.base_ref }}
          FAST_RESULT: ${{ needs.validate-fast.result }}
        run: |
          set -euo pipefail
          if [[ "$TARGET_BRANCH" == 'governance/project-ops' ]]; then
            # Separate required governance-docs validation controls this branch.
            [[ "$FAST_RESULT" == 'skipped' ]]
          else
            [[ "$FAST_RESULT" == 'success' ]]
          fi
