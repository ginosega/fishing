name: Temporary apply final KB pictures
on:
  push:
    branches: [feature/add-final-kb-pictures-20260910]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Verify packages and apply exact picture additions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json, hashlib

          def canonical(v):
              if isinstance(v, dict):
                  return '{' + ','.join(json.dumps(k,separators=(',',':')) + ':' + canonical(v[k]) for k in sorted(v)) + '}'
              if isinstance(v, list):
                  return '[' + ','.join(canonical(x) for x in v) + ']'
              return json.dumps(v,separators=(',',':'))
          def fp(v):
              return hashlib.sha256(canonical(v).encode()).hexdigest()
          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          expected_images = {
            'KB/Gear-Guides/assets/Rebel Pop-R.png': (523486,'c5e27e2a50bfc43a8f88e214bda9b9293d52449b725d404d191d8c5df43ea6c4'),
            'KB/Gear-Guides/assets/River2Sea Whopper Plopper 60.jpg': (22301,'74601f6c8bd7a670dc938b4330652ba96e8e93ec607725fa13505ef895e51476'),
          }
          for path,(size,digest) in expected_images.items():
              p=Path(path)
              assert p.is_file(), f'missing image: {path}'
              assert p.stat().st_size == size, (path,p.stat().st_size,size)
              actual=sha(path)
              assert actual == digest, (path,actual,digest)

          kb_path=Path('KB/kb.json')
          data=json.loads(kb_path.read_text())
          byid={x['id']:x for x in data['entities']}
          expected_records={
            'technique-popper':'2d96f118d3e3861e0c1f353ef4bd928ac1b02eb254914494c70a2e4f06ae04b9',
            'technique-whopper-plopper':'bcde74d07176528c932e0dd724b83d8c7dd5e57bb5ccc7dcd0bdcc40481b6464',
          }
          for rid,digest in expected_records.items():
              actual=fp(byid[rid])
              assert actual == digest, (rid,actual,digest)
              assert 'picture' not in byid[rid], (rid,byid[rid].get('picture'))

          byid['technique-popper']['picture']={
            'src':'KB/Gear-Guides/assets/Rebel Pop-R.png',
            'caption':'Rebel Pop-R'
          }
          byid['technique-whopper-plopper']['picture']={
            'src':'KB/Gear-Guides/assets/River2Sea Whopper Plopper 60.jpg',
            'caption':'River2Sea Whopper Plopper 60'
          }
          kb_path.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          PY
          git diff --check
          git diff -- KB/kb.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add KB/kb.json
          git commit -m 'Add final deferred KB pictures'
          git push origin HEAD:${GITHUB_REF_NAME}
