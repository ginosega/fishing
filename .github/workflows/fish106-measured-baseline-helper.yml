name: FISH106 measured baseline helper

on:
  push:
    branches:
      - feature/fish106-gear-tools-storage

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply measured FISH106 baselines
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pwa/test/core.test.mjs')
          s=p.read_text(encoding='utf-8')
          assert 'validateLibraryPaths(data).size,108' in s
          assert 'result.references.length,240' in s
          s=s.replace('validateLibraryPaths(data).size,108','validateLibraryPaths(data).size,110')
          s=s.replace('result.references.length,240','result.references.length,245')
          p.write_text(s,encoding='utf-8')
          PY
          git rm .github/workflows/fish106-measured-baseline-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pwa/test/core.test.mjs
          git commit -m "FISH106: apply measured acceptance baselines"
          git push origin HEAD:feature/fish106-gear-tools-storage
