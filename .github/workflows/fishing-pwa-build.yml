name: Fishing PWA build and deploy

on:
  push:
    branches:
      - main
    paths:
      - 'pwa/**'
      - 'Fishing_Gear_Registry.md'
      - 'Fishing_Tackle_Inventory.md'
      - 'Topics/Rods_Reels_Line_Knots.md'
      - 'Topics/Fishing_Techniques.md'
      - 'Topics/Local_Waters_Locations.md'
      - 'Topics/Trip_Logs_Field_Observations.md'
      - '.github/workflows/fishing-pwa-build.yml'
  pull_request:
    paths:
      - 'pwa/**'
      - 'Fishing_Gear_Registry.md'
      - 'Fishing_Tackle_Inventory.md'
      - 'Topics/Rods_Reels_Line_Knots.md'
      - 'Topics/Fishing_Techniques.md'
      - 'Topics/Local_Waters_Locations.md'
      - 'Topics/Trip_Logs_Field_Observations.md'
      - '.github/workflows/fishing-pwa-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fishing-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check pwa/app.js
          node --check pwa/media-ui.js
          node --check pwa/link-ui.js
          node --check pwa/build.mjs
          node --check pwa/serve.mjs
      - name: Test manufacturer link normalization
        run: node pwa/link-ui.test.mjs
      - name: Build PWA
        run: node pwa/build.mjs
      - name: Verify bundle
        run: |
          test -f pwa/dist/index.html
          test -f pwa/dist/sw.js
          test -f pwa/dist/media-ui.js
          test -f pwa/dist/link-ui.js
          test -f pwa/dist/gear-media.json
          test -f pwa/dist/video-titles.json
          test -f pwa/dist/kb/Fishing_Tackle_Inventory.md
          test -f pwa/dist/kb/Rods_Reels_Line_Knots.md
          grep -q 'app.js?v=' pwa/dist/index.html
          grep -q 'media-ui.js?v=' pwa/dist/index.html
          grep -q 'link-ui.js?v=' pwa/dist/index.html
          grep -q 'styles.css?v=' pwa/dist/index.html
      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: fishing-pwa
          path: pwa/dist
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: pwa/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
