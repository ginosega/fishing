name: Fishing PWA build and deploy
on:
  pull_request:
    paths:
      - 'pwa/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package exact repository source
        run: |
          mkdir -p snapshot
          tar --exclude=.git --exclude=pwa/dist --exclude=./snapshot -czf snapshot/source.tar.gz .
          git rev-parse HEAD > snapshot/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fishing-source-snapshot
          path: snapshot/
          retention-days: 1
