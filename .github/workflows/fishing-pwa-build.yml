name: Fishing PWA build and deploy

on:
  push:
    branches:
      - main
    paths:
      - 'pwa/**'
      - 'Fishing_Gear_Registry.md'
      - 'Fishing_Tackle_Inventory.md'
      - 'Topics/Rods_Reels_Line_Knots.md'
      - 'Topics/Fishing_Techniques.md'
      - 'Topics/Local_Waters_Locations.md'
      - 'Topics/Trip_Logs_Field_Observations.md'
      - '.github/workflows/fishing-pwa-build.yml'
  pull_request:
    paths:
      - 'pwa/**'
      - 'Fishing_Gear_Registry.md'
      - 'Fishing_Tackle_Inventory.md'
      - 'Topics/Rods_Reels_Line_Knots.md'
      - 'Topics/Fishing_Techniques.md'
      - 'Topics/Local_Waters_Locations.md'
      - 'Topics/Trip_Logs_Field_Observations.md'
      - '.github/workflows/fishing-pwa-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fishing-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check pwa/gear-app.js
          node --check pwa/kb-app.js
          node --check pwa/gear-store.js
          node --check pwa/gear-model.js
          node --check pwa/kb-model.js
          node --check pwa/markdown-render.js
          node --check pwa/media-ui.js
          node --check pwa/build.mjs
          node --check pwa/apply-local-media.mjs
          node --check pwa/final-content.test.mjs
          node --check pwa/serve.mjs
      - name: Test structured My Gear model
        run: node pwa/gear-model.test.mjs
      - name: Test My Gear routing and layout
        run: node pwa/my-gear-routing.test.mjs
      - name: Test unified Knowledge Base model
        run: node pwa/kb-model.test.mjs
      - name: Test Knowledge Base routing and Markdown
        run: node pwa/kb-routing.test.mjs
      - name: Test final content batch
        run: node pwa/final-content.test.mjs
      - name: Build PWA
        run: node pwa/build.mjs
      - name: Apply and validate local media
        run: node pwa/apply-local-media.mjs
      - name: Verify bundle
        run: |
          test -f pwa/dist/index.html
          test -f pwa/dist/sw.js
          test -f pwa/dist/gear-app.js
          test -f pwa/dist/kb-app.js
          test -f pwa/dist/gear-store.js
          test -f pwa/dist/gear-model.js
          test -f pwa/dist/kb-model.js
          test -f pwa/dist/markdown-render.js
          test -f pwa/dist/data/gear.seed.json
          test -f pwa/dist/data/kb.seed.json
          test -f pwa/dist/data/catches.seed.json
          test -f pwa/dist/media-ui.js
          test -f pwa/dist/gear-media.json
          test -f pwa/dist/kb-assets.json
          test -f pwa/dist/video-titles.json
          test -f pwa/dist/kb-content/locations/lake-sammamish.md
          test -f pwa/dist/kb-content/techniques/ned-rig.md
          test -f pwa/dist/kb-content/techniques/inline-spinner.md
          test -f pwa/dist/kb-content/techniques/snaps-swivels.md
          test -f pwa/dist/kb-content/techniques/flasher-rig.md
          test -f pwa/dist/kb-content/techniques/inline-trolling-rig.md
          test -f pwa/dist/kb-content/techniques/bobber-rig.md
          test -f pwa/dist/kb-content/techniques/slip-sinker-rig.md
          test -f pwa/dist/kb-content/techniques/spring-fishing.md
          test -f pwa/dist/kb-content/knots/palomar.md
          test -f pwa/dist/assets/kb/species/kokanee-phases.png
          test ! -f pwa/dist/assets/kb/species/kokanee-phases.webp
          test -f pwa/dist/assets/kb/species/northern-pikeminnow.png
          test -f pwa/dist/assets/kb/species/rainbow-trout.png
          test -f pwa/dist/assets/kb/species/coastal-cutthroat-trout.png
          test -f pwa/dist/assets/kb/species/smallmouth-bass.png
          test -f pwa/dist/assets/kb/species/largemouth-bass.png
          test -f pwa/dist/assets/kb/equipment/booyah-pad-crasher.jpg
          test -f pwa/dist/assets/kb/equipment/inline-spinner-rig.png
          test -f pwa/dist/assets/kb/equipment/drop-shot.png
          test -f pwa/dist/assets/kb/equipment/wacky-worm.png
          test -f pwa/dist/assets/kb/equipment/ned-rig.png
          test -f pwa/dist/assets/kb/equipment/snap-swivel.png
          test -f pwa/dist/assets/kb/equipment/flasher-rig.png
          test -f pwa/dist/assets/kb/equipment/inline-trolling-rig.png
          test -f pwa/dist/assets/kb/equipment/bobber-rig.png
          test -f pwa/dist/assets/kb/equipment/slip-sinker-rig.png
          test -f pwa/dist/assets/gear/booyah-pad-crasher-assortment.jpg
          test -f pwa/dist/assets/gear/vmc-swimbait-jig.png
          test -f pwa/dist/assets/gear/south-bend-classic-dressed-spinners.jpg
          test -f pwa/dist/assets/gear/south-bend-removable-split-shot-sinkers.png
          test -f pwa/dist/assets/gear/south-bend-assorted-brass-swivels.png
          test -f pwa/dist/assets/gear/south-bend-hook-assortment.png
          grep -q 'gear-app.js?v=' pwa/dist/index.html
          grep -q 'kb-app.js?v=' pwa/dist/index.html
          grep -q 'media-ui.js?v=' pwa/dist/index.html
          grep -q 'styles.css?v=' pwa/dist/index.html
          grep -q 'unified Markdown-content Knowledge Base' pwa/dist/build.json
          grep -q 'kokanee-phases.png' pwa/dist/data/kb.seed.json
          grep -q 'northern-pikeminnow.png' pwa/dist/data/kb.seed.json
          grep -q 'rainbow-trout.png' pwa/dist/data/kb.seed.json
          grep -q 'coastal-cutthroat-trout.png' pwa/dist/data/kb.seed.json
          grep -q 'smallmouth-bass.png' pwa/dist/data/kb.seed.json
          grep -q 'largemouth-bass.png' pwa/dist/data/kb.seed.json
          grep -q 'booyah-pad-crasher.jpg' pwa/dist/data/kb.seed.json
          ! grep -q 'kokanee-phases.webp' pwa/dist/data/kb.seed.json
          grep -q '2026-09-04-my-gear-v2-final-content-1' pwa/dist/data/gear.seed.json
          grep -q '2026-09-04-kb-v1-final-content-1' pwa/dist/data/kb.seed.json
          grep -q 'technique-inline-spinner' pwa/dist/data/kb.seed.json
          grep -q 'technique-snaps-swivels' pwa/dist/data/kb.seed.json
          grep -q 'technique-flasher-rig' pwa/dist/data/kb.seed.json
          grep -q 'technique-inline-trolling-rig' pwa/dist/data/kb.seed.json
          grep -q 'technique-bobber-rig' pwa/dist/data/kb.seed.json
          grep -q 'technique-slip-sinker-rig' pwa/dist/data/kb.seed.json
          grep -q 'technique-spring-fishing' pwa/dist/data/kb.seed.json
          grep -q 'fin-sanity-bluegill' pwa/dist/data/kb.seed.json
          grep -q 'berkley-stunna' pwa/dist/data/kb.seed.json
          grep -q 'strike-king-kvd-square-bill-1' pwa/dist/data/kb.seed.json
          grep -q 'zman-original-chatterbait' pwa/dist/data/kb.seed.json
          grep -q 'strike-king-red-eyed-special' pwa/dist/data/kb.seed.json
          grep -q 'strike-king-tour-grade-football-jig' pwa/dist/data/kb.seed.json
          grep -q 'South Bend 125-Piece Removable Split Shot Sinkers' pwa/dist/data/gear.seed.json
          grep -q 'South Bend 24-Piece Assorted Brass Swivels' pwa/dist/data/gear.seed.json
          grep -q '"localSource": true' pwa/dist/gear-media.json
      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: fishing-pwa
          path: pwa/dist
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: pwa/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
