name: Temporary Fall Bass Fishing package apply
on:
  push:
    branches: [content/fall-bass-fishing]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: content/fall-bass-fishing
      - name: Validate and apply package
        shell: bash
        run: |
          set -euo pipefail
          python .tmp_apply_fall_bass.py
          rm .tmp_apply_fall_bass.py .github/workflows/tmp-apply-fall-bass.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Fall Bass Fishing KB page'
          git push origin HEAD:content/fall-bass-fishing
