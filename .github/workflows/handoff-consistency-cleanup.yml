name: Handoff consistency cleanup

on:
  push:
    branches:
      - reconcile/chat-handoff-consistency-20260911

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Temporary handoff consistency cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: reconcile/chat-handoff-consistency-20260911
          persist-credentials: true
          fetch-depth: 0
      - name: Reconcile stale FISH091 historical/current wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            'README.md': [
              ('## FISH090–094 current production and project-state reconciliation — September 11, 2026',
               '## Historical FISH090–094 production and project-state snapshot — September 11, 2026'),
              ('FISH077/P2 remains DEFERRED. FISH091 is WAITING ON USER requirements signoff and is not deployed. FISH090 and FISH092–094 are DONE. All unrelated fishing/equipment/content backlog and purchase uncertainty remain preserved. The next unused canonical task ID is FISH-TODO-095. Chat remains the permanent default. This reconciliation is documentation-only and does not republish the verified application release.',
               'Historical status at this milestone: FISH077/P2 remained DEFERRED; FISH091 was still waiting on requirements signoff and was not deployed; FISH090 and FISH092–094 were DONE; and the next unused canonical task ID was FISH-TODO-095. This paragraph is retained only as milestone history. Current status is the FISH091 production-complete section above. Chat remains the permanent default.'),
            ],
            'Fishing_Context.md': [
              ('## FISH090–094 current project state — September 11, 2026',
               '## Historical FISH090–094 project-state snapshot — September 11, 2026'),
              ('FISH091 is **requirements-only and not implemented**. [Draft PR96](https://github.com/ginosega/fishing/pull/96) records the proposed change from automatic complete-offline-library provisioning to an online-only default with explicit offline-library preparation through Connection Status → Update offline library. The draft explicitly authorizes no runtime, service-worker, loader, UI, build or test implementation. Required sequence remains: user requirements signoff → separate abbreviated design → user design signoff → implementation/release. Treat FISH091 as WAITING ON USER, not deployed work.',
               'Historical status at this milestone: FISH091 was **requirements-only and not implemented**. [Draft PR96](https://github.com/ginosega/fishing/pull/96) recorded the proposed change from automatic complete-offline-library provisioning to an online-only default with explicit offline-library preparation through Connection Status → Update offline library. At that point the draft authorized no runtime, service-worker, loader, UI, build or test implementation, and FISH091 was waiting on user signoff. Current FISH091 status is DONE/production-verified in the section above.'),
              ('FISH077/P2 remains DEFERRED. FISH090 and FISH092–094 are DONE; FISH091 is WAITING ON USER requirements signoff and remains unimplemented. All unrelated fishing/equipment/content backlog and purchase uncertainty remain preserved. The next unused canonical task ID is FISH-TODO-095. Continue in Chat using actual latest `main`. This documentation reconciliation is non-runtime and does not redeploy production.',
               'Historical status at this milestone: FISH077/P2 remained DEFERRED; FISH090 and FISH092–094 were DONE; FISH091 was waiting on user requirements signoff and remained unimplemented; and the next unused canonical task ID was FISH-TODO-095. This paragraph is retained only as milestone history; current status is recorded in the FISH091 production-complete section above.'),
            ],
            'Fishing_TODO.md': [
              ('## FISH090–094 current task-state reconciliation — September 11, 2026',
               '## Historical FISH090–094 task-state snapshot — September 11, 2026'),
              ('FISH090 is DONE through PR95/run `34634890084`. FISH091 is WAITING ON USER: draft PR96 is requirements-only and explicitly contains no runtime/design implementation authorization. FISH092 is DONE through PR97/run `34640020315`. FISH093 is DONE through PR98/run `34642839586` attempt 2. FISH094 is DONE through PR99/run `34645325275`. FISH077/P2 remains DEFERRED. All unrelated fishing/equipment/content backlog and purchase uncertainty are preserved. The next unused canonical task ID is FISH-TODO-095. This documentation reconciliation does not redeploy the application.',
               'Historical status at this milestone: FISH090 was DONE through PR95/run `34634890084`; FISH091 was waiting on user signoff in requirements-only draft PR96; FISH092 was DONE through PR97/run `34640020315`; FISH093 was DONE through PR98/run `34642839586` attempt 2; FISH094 was DONE through PR99/run `34645325275`; FISH077/P2 remained DEFERRED; and the next unused canonical task ID was FISH-TODO-095. Current FISH091 status is DONE/production-verified in the section above.'),
              ('| FISH-TODO-091 | P1 | DESIGN REVIEW | Requirements approved as written, including S1–S4. PR103 records approval on current main; draft PR104 contains the separate abbreviated design. No implementation is authorized until explicit user design signoff. |',
               '| FISH-TODO-091 | P1 | DONE | Requirements and abbreviated design were separately approved through PR103/PR104; PR105 implemented the online-only default and explicit verified offline-library preparation. Production source `44fa3bcbff289d2a7aa37c4967e0f5f195b53ca0`, release `01c5ed3535d358086032b0985e2af87b`, run `34676802369` passed the full production, exact-current-main, hosted-byte and hosted-browser gates. |'),
            ],
            'Fishing_Decision_Log.md': [
              ('FISH095 is DONE. FISH091 remains WAITING ON USER and unimplemented; FISH077/P2 remains DEFERRED. No schema, architecture, identity, Catch, media-policy or P2 design decision changed. Next unused task ID: **FISH-TODO-096**.',
               'Historical status at the FISH095 milestone: FISH095 was DONE; FISH091 was still waiting on user approval and unimplemented; FISH077/P2 remained DEFERRED. No schema, architecture, identity, Catch, media-policy or P2 design decision changed. The next unused task ID was **FISH-TODO-096**.'),
              ('## FISH090–094 current decisions and release closeout — September 11, 2026',
               '## Historical FISH090–094 decisions and release closeout — September 11, 2026'),
              ('Decision/status for FISH091/[draft PR96](https://github.com/ginosega/fishing/pull/96): the proposed online-only default is **not implemented and not implementation-authorized**. PR96 is a requirements/change-request review only. No runtime, service-worker, loader, UI, build or test changes are authorized by opening/reviewing that draft. Required sequence is user requirements signoff, separate abbreviated design, user design signoff, then implementation/release. FISH091 remains WAITING ON USER.',
               'Historical decision/status for FISH091/[draft PR96](https://github.com/ginosega/fishing/pull/96): at that milestone the proposed online-only default was **not implemented and not implementation-authorized**. PR96 was a requirements/change-request review only. No runtime, service-worker, loader, UI, build or test changes were authorized by opening/reviewing that draft. The required sequence was user requirements signoff, separate abbreviated design, user design signoff, then implementation/release. Current status is superseded by the production-complete FISH091 decision at the top of this log.'),
              ('FISH077/P2 remains DEFERRED. FISH090 and FISH092–094 are DONE; FISH091 is WAITING ON USER and unimplemented. All unrelated backlog and purchase uncertainty are unchanged. Next unused canonical task ID: FISH-TODO-095. This reconciliation is documentation-only and does not republish production.',
               'Historical status at this milestone: FISH077/P2 remained DEFERRED; FISH090 and FISH092–094 were DONE; FISH091 was waiting on user approval and unimplemented; and the next unused canonical task ID was FISH-TODO-095. This paragraph is retained only as milestone history.'),
              ("FISH-TODO-084 through FISH-TODO-090 and FISH-TODO-092 through FISH-TODO-095 are DONE. FISH-TODO-091 is WAITING ON USER requirements signoff in draft PR96 and remains unimplemented; FISH-TODO-077/P2 remains DEFERRED. The canonical TODO retains all existing fishing/gear research and purchase uncertainty. All seven originally deferred required pictures are resolved; the historically optional generic inline-spinner now has the user-supplied Kingforest image through FISH088. Production cutover and automated/hosted acceptance are complete, including FISH095 PR101/PR102 and final run 34656039216. FISH063's old media-authoring policy and FISH039's setup recording are superseded for v2; they do not justify reintroducing retired structures. PowerBait hook-size and loop-knot guidance remain unresolved. The next unused canonical task ID is FISH-TODO-096. No approved future feature is treated as already deployed.",
               "FISH-TODO-084 through FISH-TODO-095 are DONE. FISH-TODO-077/P2 remains DEFERRED. The canonical TODO retains all existing fishing/gear research and purchase uncertainty. All seven originally deferred required pictures are resolved; the historically optional generic inline-spinner now has the user-supplied Kingforest image through FISH088. Production cutover and automated/hosted acceptance are complete through FISH091/PR105: source `44fa3bcbff289d2a7aa37c4967e0f5f195b53ca0`, release `01c5ed3535d358086032b0985e2af87b`, run `34676802369`. FISH063's old media-authoring policy and FISH039's setup recording are superseded for v2; they do not justify reintroducing retired structures. PowerBait hook-size and loop-knot guidance remain unresolved. The next unused canonical task ID is FISH-TODO-096. No approved future feature is treated as already deployed."),
            ],
            'Fishing_New_Chat_Bootstrap_Prompt.md': [
              ('## FISH090–094 current state — September 11, 2026',
               '## Historical FISH090–094 state — September 11, 2026'),
              ('FISH077/P2 remains DEFERRED. FISH090 and FISH092–094 are DONE. FISH091 is WAITING ON USER and not deployed. All unrelated backlog and purchase uncertainty remain preserved. The next unused canonical task ID is FISH-TODO-095. Resume from actual latest `main` and the user’s next requested work; do not restart completed FISH090/FISH092/FISH093/FISH094 release work. Documentation-only reconciliation does not redeploy production.',
               'Historical status at this milestone: FISH077/P2 remained DEFERRED; FISH090 and FISH092–094 were DONE; FISH091 was waiting on user approval and not deployed; and the next unused canonical task ID was FISH-TODO-095. This paragraph is retained only as milestone history. Current FISH091 status and the current continuation point are recorded at the top of this bootstrap.'),
            ],
            'pwa/README.md': [
              ('## Current production and repository-layout state — September 11, 2026',
               '## Historical production and repository-layout state — before FISH091 completion'),
              ('FISH077/P2 remains DEFERRED. FISH090 and FISH092–094 are DONE; FISH091 remains unimplemented pending requirements signoff. Next unused canonical task ID is FISH-TODO-095. Documentation-only reconciliation does not republish the application.',
               'Historical status at this milestone: FISH077/P2 remained DEFERRED; FISH090 and FISH092–094 were DONE; FISH091 was still unimplemented pending requirements signoff; and the next unused canonical task ID was FISH-TODO-095. Current FISH091 production status is recorded in the section above.'),
            ],
          }

          for file_name, pairs in replacements.items():
              p = Path(file_name)
              text = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  assert count == 1, f'{file_name}: expected exactly one match, found {count}: {old[:100]}'
                  text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          Path('.github/workflows/handoff-consistency-cleanup.yml').unlink()
          PY
          git diff --check
      - name: Commit final handoff consistency cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md Fishing_Context.md Fishing_TODO.md Fishing_Decision_Log.md Fishing_New_Chat_Bootstrap_Prompt.md pwa/README.md .github/workflows/handoff-consistency-cleanup.yml
          git commit -m 'Reconcile final Chat handoff consistency'
          git push origin HEAD:reconcile/chat-handoff-consistency-20260911
