name: One-time Cranberry page copy preparation
on:
  push:
    branches:
      - feature/cranberry-lake-picture-20260908
    paths:
      - .github/workflows/cranberry-copy-preparation.yml
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.head_commit.message == 'Stage requested page subtitle corrections'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply scoped copy changes
        run: node .release-work/apply-page-copy.mjs
      - name: Validate syntax, routing and source models
        run: |
          node --check pwa/kb-app.js
          node --check pwa/kb-routing.test.mjs
          node pwa/kb-routing.test.mjs
          node pwa/kb-model.test.mjs
          node pwa/cranberry-lake-picture.test.mjs
          node pwa/final-content.test.mjs
      - name: Commit scoped changes and remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pwa/kb-app.js pwa/kb-routing.test.mjs
          git rm .github/workflows/cranberry-copy-preparation.yml
          git rm -r -f .release-work
          git diff --cached --check
          git commit -m 'Unify Knowledge Base and Catch Log page subtitles'
          git push origin HEAD:feature/cranberry-lake-picture-20260908
