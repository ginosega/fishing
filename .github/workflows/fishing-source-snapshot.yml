name: Fishing source snapshot
on:
  pull_request:
    paths:
      - '.github/workflows/fishing-source-snapshot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package exact source
        run: |
          tar --exclude=.git --exclude=pwa/dist -czf /tmp/fishing-source.tar.gz .
          mkdir -p snapshot
          cp /tmp/fishing-source.tar.gz snapshot/source.tar.gz
          git rev-parse HEAD > snapshot/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fishing-source-snapshot
          path: snapshot/
          retention-days: 1
