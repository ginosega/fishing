name: One-time authored Notes reconciliation

on:
  push:
    branches:
      - feature/unify-authored-notes-20260904

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ hashFiles('pwa/reconcile-authored-notes-once.mjs') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final authored Notes reconciliation
        run: node pwa/reconcile-authored-notes-once.mjs
      - name: Commit reconciled source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Finalize authored Notes implementation"
            git push origin HEAD:feature/unify-authored-notes-20260904
          fi
