name: Temporary apply Lucas reel oil package

on:
  push:
    branches:
      - add-lucas-reel-oil

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-lucas-reel-oil
      - name: Validate uploaded media and apply exact Gear record
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          image = Path('pwa/Gear/Equipment/assets/Lucas-Fishing-Reel-Oil.png')
          raw = image.read_bytes()
          expected_bytes = 910591
          expected_sha256 = '2fba8d2c75d8de2c755fc719d057bb94e14b9fc906dae5cb932036ca777b6eae'
          actual_sha256 = hashlib.sha256(raw).hexdigest()
          assert len(raw) == expected_bytes, (len(raw), expected_bytes)
          assert actual_sha256 == expected_sha256, (actual_sha256, expected_sha256)

          gear_path = Path('pwa/Gear/gear.json')
          doc = json.loads(gear_path.read_text(encoding='utf-8'))
          assert doc.get('schemaVersion') == 2
          items = doc['items']
          assert all(item.get('id') != 'lucas-fishing-reel-oil' for item in items)

          record = {
            'id': 'lucas-fishing-reel-oil',
            'name': 'Lucas Fishing Reel Oil',
            'category': 'accessories',
            'type': 'Tools',
            'specifications': [
              {'value': '1 oz', 'label': 'Size'}
            ],
            'links': [
              {'label': 'Lucas', 'url': 'https://www.lucasoil.com/product/fishing-reel-oil/'},
              {'label': 'Amazon', 'url': 'https://a.co/d/08RHQJId'}
            ],
            'manufacturer': 'Lucas',
            'model': 'Fishing Reel Oil',
            'picture': {
              'src': 'Gear/Equipment/assets/Lucas-Fishing-Reel-Oil.png',
              'caption': 'Lucas Fishing Reel Oil'
            }
          }

          try:
              index = next(i for i, item in enumerate(items) if item.get('id') == 'electronics-research')
          except StopIteration:
              index = len(items)
          items.insert(index, record)
          gear_path.write_text(json.dumps(doc, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(f'validated bytes={len(raw)} sha256={actual_sha256}')
          print(f'inserted lucas-fishing-reel-oil at index {index}')
          PY
      - name: Commit exact content change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Gino Sega"
          git config user.email "ginosega@gmail.com"
          git add pwa/Gear/gear.json
          git diff --cached --check
          git commit -m "Add Lucas Fishing Reel Oil [skip ci]"
          git push origin HEAD:add-lucas-reel-oil
