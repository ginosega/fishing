name: Temporary close required media
on:
  push:
    branches: [docs/close-required-media-20260910]
permissions:
  contents: write
jobs:
  reconcile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Reconcile required-media completion
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          source='76094d48055ca9e2363298763cdbf00586fbeb71'
          run='34544432559'
          release='d6334fcb8a34834f1918df95b8f04efd'

          def replace_first_para(path, heading, text):
              p=Path(path); s=p.read_text(); marker=heading+'\n\n'
              i=s.find(marker); assert i>=0,(path,heading)
              a=i+len(marker); b=s.find('\n\n',a); assert b>=0
              p.write_text(s[:a]+text+s[b:])

          replace_first_para('README.md','## Current production state — September 10, 2026',
            f'Fishing Companion production source `{source}` is published and hosted-verified by [production run {run}](https://github.com/ginosega/fishing/actions/runs/{run}); release `{release}` contains 205 hosted files and passed production navigation, image-viewer, complete-offline-reload and record-count checks. Routine site-authored updates include PR75/PR76 (Pflueger spincast rod/reel), PR77 (Tsuridamashii snap-swivels picture), PR79 (Rapala Original Floating, Mack\'s Pee Wee Hoochie, River2Sea Whopper Plopper 60 and Yellow Perch pictures plus Rebel Pop-R replacement), PR81 (Kokanee/Largemouth/Smallmouth Species updates), and PR84 (Popper and Whopper Plopper Gear-Guide pictures). All seven originally deferred required pictures have now been supplied and published. Generic inline-spinner remains optional. The cleanup and initial-release sections below are dated historical evidence; P2 remains deferred.')

          replace_first_para('Fishing_Context.md','## Current production state — September 10, 2026',
            f'Current Fishing Companion production source is `{source}`, published and hosted-verified by [run {run}](https://github.com/ginosega/fishing/actions/runs/{run}); release `{release}` contains 205 hosted files and passed production navigation, image-viewer, complete-offline-reload and record-count checks. Post-production site-authored changes now include PR75/PR76 (Pflueger spincast rod/reel), PR77 (Tsuridamashii snap-swivels picture), PR79 (four previously deferred pictures plus Rebel Pop-R replacement), PR81 (Kokanee/Largemouth/Smallmouth Species updates), and PR84 (Popper and Whopper Plopper Gear-Guide pictures). All seven originally deferred required pictures are now resolved and live. Generic inline-spinner remains optional. FISH078 is DONE; P2 remains deferred. Earlier cleanup/initial-release sections below remain dated historical evidence.')
          p=Path('Fishing_Context.md'); s=p.read_text()
          old="The original production decision explicitly approved absence of seven required pictures and remains preserved in `pwa/migration/media-decisions.json` as historical migration disposition. The user later supplied Tsuridamashii through PR77 and Rapala Original Floating, Mack's Pee Wee Hoochie, River2Sea Whopper Plopper 60 and Yellow Perch through PR79. Only two required pictures remain deferred: KB Popper and KB Whopper Plopper. Generic inline-spinner remains optional. The user will supply remaining pictures later; do not acquire them automatically or reinterpret the historical migration disposition as current absence."
          new="The original production decision explicitly approved absence of seven required pictures and remains preserved in `pwa/migration/media-decisions.json` as historical migration disposition. The user later supplied Tsuridamashii through PR77; Rapala Original Floating, Mack's Pee Wee Hoochie, River2Sea Whopper Plopper 60 and Yellow Perch through PR79; and Popper plus Whopper Plopper Gear-Guide pictures through PR84. All seven required picture exceptions are now resolved. Generic inline-spinner remains optional. Do not reinterpret the historical migration disposition as current absence or automatically acquire optional imagery."
          assert s.count(old)==1,('context pictures',s.count(old)); s=s.replace(old,new,1)
          old="FISH071–076,079–083 are DONE; FISH077 is DEFERRED. FISH078 remains DEFERRED for the two still-missing required pictures: KB Popper and KB Whopper Plopper. Tsuridamashii was supplied through PR77 and four additional missing pictures through PR79. Unrelated fishing/equipment/content backlog is preserved; next unused ID is084. Continue in Chat using the current bootstrap. New work must restore actual latest main, use normal PR/CI for runtime changes and update authoritative records after actual milestones."
          new="FISH071–076 and FISH078–083 are DONE; FISH077 is DEFERRED. FISH078 closed after PR84 supplied the final two required pictures, Popper and Whopper Plopper; all seven originally deferred required pictures are now resolved. Generic inline-spinner remains optional. Unrelated fishing/equipment/content backlog is preserved; next unused ID is084. Continue in Chat using the current bootstrap. New work must restore actual latest main, use normal PR/CI for runtime changes and update authoritative records after actual milestones."
          assert s.count(old)==1,('context backlog',s.count(old)); p.write_text(s.replace(old,new,1))

          replace_first_para('Fishing_TODO.md','## Current production state — September 10, 2026',
            f'Current Fishing Companion production source is `{source}`, published and hosted-verified by [run {run}](https://github.com/ginosega/fishing/actions/runs/{run}); release `{release}` contains 205 hosted files. PR77 supplied Tsuridamashii; PR79 supplied Rapala Original Floating, Mack\'s Pee Wee Hoochie, River2Sea Whopper Plopper 60 and Yellow Perch and replaced Rebel Pop-R; PR81 updated Kokanee/Largemouth/Smallmouth; PR84 supplied the final Popper and Whopper Plopper Gear-Guide pictures. All seven originally deferred required pictures are now resolved. FISH078 is DONE. Generic inline-spinner remains optional; no new task ID is consumed.')
          p=Path('Fishing_TODO.md'); s=p.read_text(); lines=s.splitlines()
          idx=[i for i,l in enumerate(lines) if l.startswith('| FISH-TODO-078 |')]; assert len(idx)==1,idx
          lines[idx[0]]="| FISH-TODO-078 | P2 | DONE | Original production accepted seven required pictures as absent. Tsuridamashii was supplied in PR77; PR79 supplied Rapala Original Floating F-3, Mack's Pee Wee Hoochie, River2Sea Whopper Plopper 60 and Yellow Perch; PR84 supplied the final Popper and Whopper Plopper Gear-Guide pictures. All seven required exceptions are resolved. Generic inline-spinner remains optional. Preserve original migration/media decisions as historical disposition. |"
          p.write_text('\n'.join(lines)+'\n')

          replace_first_para('Fishing_Decision_Log.md','## Post-production authoring updates — September 10, 2026',
            f'The site-authored Prepare Changes → Copy Changes workflow has now been exercised through routine production updates including PR75/PR76 (Pflueger spincast rod/reel), PR77 (Tsuridamashii snap-swivels picture), PR79 (four previously deferred pictures plus Rebel Pop-R replacement), PR81 (Kokanee/Largemouth/Smallmouth Species updates), and PR84 (the final Popper and Whopper Plopper Gear-Guide pictures). Current production source `{source}` passed the full production pipeline and hosted verification in [run {run}](https://github.com/ginosega/fishing/actions/runs/{run}); release `{release}` contains 205 hosted files. The original decision accepting seven missing required pictures remains historical authority for the cutover; all seven exceptions are now resolved by later user-supplied images. FISH078 is DONE. Generic inline-spinner remains optional; P2 remains DEFERRED.')

          p=Path('Fishing_New_Chat_Bootstrap_Prompt.md'); s=p.read_text()
          old_start=s.find('## Current state and operating mode\n\n'); assert old_start>=0
          a=old_start+len('## Current state and operating mode\n\n'); b=s.find('\n\n',a); assert b>=0
          current=f'V2 is published at [Fishing Companion](https://ginosega.github.io/fishing/). Current production source `{source}` passed the complete production pipeline and actual hosted verification in [run {run}](https://github.com/ginosega/fishing/actions/runs/{run}); release `{release}` contains 205 hosted files. Post-production site-authored changes include PR75/PR76 (Pflueger spincast rod/reel), PR77 (Tsuridamashii snap-swivels picture), PR79 (four previously deferred pictures plus Rebel Pop-R replacement), PR81 (Kokanee/Largemouth/Smallmouth Species updates), and PR84 (final Popper and Whopper Plopper Gear-Guide pictures). All seven originally deferred required pictures are resolved and live. Generic inline-spinner remains optional. No acceptance or media approval blocks routine releases.'
          s=s[:a]+current+s[b:]
          old="The original seven-picture absence decision is historical production-cutover evidence. PR77 subsequently supplied Tsuridamashii; PR79 supplied Rapala Original Floating, Mack's Pee Wee Hoochie, River2Sea Whopper Plopper 60 and Yellow Perch. Two required pictures remain deferred: KB Popper and KB Whopper Plopper. Generic inline-spinner is optional. `pwa/migration/media-decisions.json` preserves the original accepted-absence disposition; do not reinterpret it as proof that a later-supplied canonical picture is absent. I will supply remaining pictures later; do not acquire them automatically."
          new="The original seven-picture absence decision is historical production-cutover evidence. PR77 supplied Tsuridamashii; PR79 supplied Rapala Original Floating, Mack's Pee Wee Hoochie, River2Sea Whopper Plopper 60 and Yellow Perch; PR84 supplied Popper and Whopper Plopper. All seven required picture exceptions are resolved. Generic inline-spinner is optional. `pwa/migration/media-decisions.json` preserves the original accepted-absence disposition; do not reinterpret it as current absence or automatically acquire optional imagery."
          assert s.count(old)==1,('bootstrap pictures',s.count(old)); s=s.replace(old,new,1)
          old="The source-equivalence waiver stands; no separate physical-device/IndexedDB export or inspection is claimed. Retain old browser stores and reconcile later-discovered local-only data before retirement. FISH076 and FISH083 are DONE; FISH078 remains DEFERRED for the two remaining required pictures (KB Popper and KB Whopper Plopper) and P2 is DEFERRED. Unrelated backlog remains; next unused task ID084. Update Context, Decision Log, TODO, README, affected source/technical/release records and this bootstrap after actual milestones; cross-check before handoff."
          new="The source-equivalence waiver stands; no separate physical-device/IndexedDB export or inspection is claimed. Retain old browser stores and reconcile later-discovered local-only data before retirement. FISH076, FISH078 and FISH083 are DONE; P2 FISH077 remains DEFERRED. All originally required missing pictures are resolved; generic inline-spinner remains optional. Unrelated backlog remains; next unused task ID084. Update Context, Decision Log, TODO, README, affected source/technical/release records and this bootstrap after actual milestones; cross-check before handoff."
          assert s.count(old)==1,('bootstrap tail',s.count(old)); p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git diff -- README.md Fishing_Context.md Fishing_TODO.md Fishing_Decision_Log.md Fishing_New_Chat_Bootstrap_Prompt.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md Fishing_Context.md Fishing_TODO.md Fishing_Decision_Log.md Fishing_New_Chat_Bootstrap_Prompt.md
          git commit -m 'Close required media backlog'
          git push origin HEAD:${GITHUB_REF_NAME}
