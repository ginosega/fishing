name: Fishing RVR119 media integration
on:
  push:
    branches:
      - content/add-bonafide-rvr119
    paths:
      - '.github/workflows/fishing-rvr119-media-integration.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/add-bonafide-rvr119
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Register exact user-uploaded media
        run: |
          node pwa/integrate-rvr119-media.mjs
          node pwa/gear-model.test.mjs
          node pwa/final-content.test.mjs
      - name: Commit non-workflow source
        run: |
          git config user.name "Fishing Project"
          git config user.email "actions@users.noreply.github.com"
          git add pwa/media-sources.json pwa/media-owners.json pwa/local-media.json pwa/final-content.test.mjs
          git commit -m "Register Bonafide RVR119 local image"
          git push origin HEAD:content/add-bonafide-rvr119
