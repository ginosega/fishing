name: One-time Cranberry documentation closeout
on:
  push:
    branches:
      - docs/cranberry-copy-closeout-20260908
    paths:
      - .github/workflows/cranberry-closeout.yml
permissions:
  contents: write
jobs:
  reconcile:
    if: github.event.head_commit.message == 'Stage Cranberry release closeout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile current records against the deployed release
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import assert from 'node:assert/strict';
          const p='.release-work/reconcile-cranberry.mjs';
          let s=await fs.readFile(p,'utf8');
          const old='Same CI/merge/production evidence as FISH070. DONE. |';
          assert.equal(s.split(old).length,2);
          s=s.replace(old,'Same CI/merge/production evidence as FISH070. See pwa/RELEASE_2026-09-08_CRANBERRY_COPY.md. DONE. |');
          await fs.writeFile(p,s);
          NODE
          node .release-work/reconcile-cranberry.mjs
      - name: Check exact archived source preservation
        run: |
          git diff --check
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const files=['README.md','Fishing_Context.md','Fishing_TODO.md','Fishing_Decision_Log.md','Fishing_New_Chat_Bootstrap_Prompt.md','pwa/README.md'];
          for(const p of files) assert.ok(fs.existsSync('History/2026-09-08-pre-cranberry-closeout/'+p));
          assert.ok(fs.readFileSync('pwa/RELEASE_2026-09-08_CRANBERRY_COPY.md','utf8').includes('34191692935'));
          NODE
      - name: Commit records and remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md Fishing_Context.md Fishing_TODO.md Fishing_Decision_Log.md Fishing_New_Chat_Bootstrap_Prompt.md pwa/README.md
          git rm .github/workflows/cranberry-closeout.yml
          git rm -r -f .release-work
          git diff --cached --check
          git commit -m 'Reconcile Cranberry release and page-copy records'
          git push origin HEAD:docs/cranberry-copy-closeout-20260908
