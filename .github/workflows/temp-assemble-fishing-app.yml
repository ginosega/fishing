name: Temporary Fishing App Assembly

on:
  push:
    paths:
      - '.github/workflows/temp-assemble-fishing-app.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble and validate app.js
        run: |
          cat .app-assembly/part-*.js > pwa/app.js
          python - <<'PY'
          from pathlib import Path
          p = Path('pwa/app.js')
          s = p.read_text()
          old = "function uniqueLinks(links){const s=new Set();return (links||[]).filter(l=>l?.url&&!s.has(l.url)&&s.add(l.url));}"
          new = "function uniqueLinks(links){const s=new Set();return (links||[]).filter(l=>{if(!l)return false;const key=l.url||`missing:${normalize(l.label||'')}`;if(!key||s.has(key))return false;s.add(key);return true;});}"
          if old not in s:
              raise SystemExit('uniqueLinks target not found')
          p.write_text(s.replace(old, new))
          PY
          node --check pwa/app.js

      - name: Commit assembled app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pwa/app.js
          if git diff --cached --quiet; then
            echo "No app.js changes to commit"
            exit 0
          fi
          git commit -m "Refactor My Gear experience"
          git push
