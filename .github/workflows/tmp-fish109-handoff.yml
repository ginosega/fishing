name: Temporary FISH109 handoff reconciliation

on:
  push:
    branches:
      - docs/fish109-handoff
    paths:
      - .github/workflows/tmp-fish109-handoff.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/fish109-handoff
      - name: Reconcile durable project records
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new))

          replace('README.md',
          'Changing library counts are source data, not durable test baselines. Current counts and release identity are derived from canonical source and the exact generated release rather than maintained manually in project-state Markdown.\n',
          'Changing library counts are source data, not durable test baselines. Current counts and release identity are derived from canonical source and the exact generated release rather than maintained manually in project-state Markdown.\n\n**FISH109** hardens release retries without changing the two-lane model: Pages and hosted-evidence artifacts are named per workflow run attempt, and the fast hosted verifier retries bounded transient propagation/network failures. A failed deployment job can therefore be rerun without colliding with an earlier `github-pages` artifact.\n')
          replace('README.md',
          'Preserve unresolved fishing/equipment/content backlog and explicit purchase uncertainty. FISH071–076 and FISH078–108 are complete/implemented;',
          'Preserve unresolved fishing/equipment/content backlog and explicit purchase uncertainty. FISH071–076 and FISH078–109 are complete/implemented;')
          replace('README.md',
          'The next unused **application/architecture** task ID is **FISH-TODO-109**.',
          'The next unused **application/architecture** task ID is **FISH-TODO-110**.')

          replace('Fishing_Context.md',
          'FISH108 itself changes workflows/tests/release tooling and therefore is released through the full lane.\n',
          'FISH108 itself changes workflows/tests/release tooling and therefore is released through the full lane.\n\n### FISH109 — release retry hardening\n\nFISH109 is complete and production-verified. Both deployment lanes use run-attempt-specific Pages and hosted-evidence artifact names, so rerunning a failed deployment cannot collide with an earlier `github-pages` artifact from the same workflow run. The dependency-free fast hosted verifier also retries a bounded set of transient propagation/network failures with backoff before declaring failure. Exact-current-main protection remains mandatory and still prevents an older run from deploying after `main` advances.\n')
          replace('Fishing_Context.md',
          'FISH071–076 and FISH078–108 are complete/implemented. The next unused **application/architecture** task ID is **FISH-TODO-109**.',
          'FISH071–076 and FISH078–109 are complete/implemented. The next unused **application/architecture** task ID is **FISH-TODO-110**.')

          replace('Fishing_TODO.md',
          'Routine Fast Content Releases are ordinary authoring events, not application tasks. They do **not** consume a `FISH-TODO-###` application/architecture ID and do not require per-item project-state or production-closeout documentation. The next unused application/architecture task ID is **FISH-TODO-109**.\n',
          'Routine Fast Content Releases are ordinary authoring events, not application tasks. They do **not** consume a `FISH-TODO-###` application/architecture ID and do not require per-item project-state or production-closeout documentation.\n\n**FISH-TODO-109 — IMPLEMENTED / release-retry hardening.** FISH109 makes Pages deployment reruns safe by using run-attempt-specific Pages and hosted-evidence artifact names, and adds bounded retries/backoff to the fast hosted verifier for transient propagation/network responses. Exact-current-main protection remains unchanged. The merged-main full release and hosted browser verification passed. The next unused application/architecture task ID is **FISH-TODO-110**.\n')
          replace('Fishing_TODO.md',
          'FISH071–076 and FISH078–108 are complete/implemented.',
          'FISH071–076 and FISH078–109 are complete/implemented.')
          replace('Fishing_TODO.md',
          'For a routine source-aware Gear/KB/Catch authoring package, use the FISH108 Fast Content Release policy and **do not allocate FISH-TODO-109**. Allocate FISH-TODO-109 only for the next application/architecture-level task unless a newer application task already exists on current `main`.\n\nDo not reopen completed FISH096–FISH108',
          'For a routine source-aware Gear/KB/Catch authoring package, use the FISH108 Fast Content Release policy and **do not allocate FISH-TODO-110**. Allocate FISH-TODO-110 only for the next application/architecture-level task unless a newer application task already exists on current `main`.\n\nDo not reopen completed FISH096–FISH109')

          replace('Fishing_Decision_Log.md',
          'Update project-state documents when architecture/product behavior/durable decisions/backlog state changes, or during a requested handoff/reconciliation.\n',
          'Update project-state documents when architecture/product behavior/durable decisions/backlog state changes, or during a requested handoff/reconciliation.\n\n## FISH109 — release retry hardening\n\n**Decision/status:** IMPLEMENTED and production-verified. Pages deployment artifacts and hosted-evidence artifacts are named with `github.run_attempt`, allowing a failed deployment job to be rerun without duplicate-artifact ambiguity. The fast hosted verifier retries only bounded transient HTTP/network failures with backoff; persistent or non-retryable mismatches still fail. The exact-current-main guard remains authoritative and must not be bypassed when `main` advances during a run.\n')
          replace('Fishing_Decision_Log.md',
          'FISH071–076 and FISH078–108 are complete/implemented. The next unused **application/architecture** task ID is **FISH-TODO-109** unless actual current `main` already allocated it. Routine Fast Content Releases do not consume that ID.',
          'FISH071–076 and FISH078–109 are complete/implemented. The next unused **application/architecture** task ID is **FISH-TODO-110** unless actual current `main` already allocated it. Routine Fast Content Releases do not consume that ID.')

          replace('Fishing_New_Chat_Bootstrap_Prompt.md',
          '### Source-derived expectations\n',
          '### FISH109 retry hardening\n\nFISH109 is complete and production-verified. Pages and hosted-evidence artifacts are run-attempt-specific, so deployment-job reruns do not collide with artifacts from earlier attempts. The fast hosted verifier uses bounded retries/backoff for transient propagation/network failures. Preserve the exact-current-main guard: if `main` advances, do not force an older run to deploy.\n\n### Source-derived expectations\n')
          replace('Fishing_New_Chat_Bootstrap_Prompt.md',
          'FISH071–076 and FISH078–108 are complete/implemented. The next unused **application/architecture** task ID is **FISH-TODO-109** unless actual newer `main` already allocated it. Routine Fast Content Releases — including a normal new KB page — do not consume FISH-TODO-109.',
          'FISH071–076 and FISH078–109 are complete/implemented. The next unused **application/architecture** task ID is **FISH-TODO-110** unless actual newer `main` already allocated it. Routine Fast Content Releases — including a normal new KB page — do not consume FISH-TODO-110.')

          replace('pwa/README.md',
          'If eligibility is uncertain, use full.\n',
          'If eligibility is uncertain, use full.\n\n### FISH109 rerun hardening\n\nPages deployment and hosted-evidence artifact names include `github.run_attempt`, so a failed deployment job can be rerun without duplicate `github-pages` artifact ambiguity. `tools/verify-hosted-fast.mjs` uses bounded backoff for transient Pages propagation/network responses while still failing persistent byte/release mismatches. The exact-current-main guard remains mandatory and prevents stale runs from deploying after `main` advances.\n')
          replace('pwa/README.md',
          '`tools/verify-hosted-fast.mjs` is intentionally dependency-free and is used only after a fast content deployment to compare every hosted file against the exact built `dist/` tree and verify release/source identity.',
          '`tools/verify-hosted-fast.mjs` is intentionally dependency-free and is used only after a fast content deployment to compare every hosted file against the exact built `dist/` tree and verify release/source identity; FISH109 adds bounded retry/backoff for transient propagation/network failures.')

          Path('pwa/docs/FISH109_Production_Closeout_2026-09-14.md').write_text('''# FISH109 Production Closeout — September 14, 2026\n\nFISH109 hardens Fishing Companion production release retries. It does not change canonical Gear/KB/Catch content or the FISH108 two-lane release classification.\n\n## Change\n\n- PR: #143 — `FISH109: harden hosted verification and Pages reruns`\n- Merged application source: `262338a6714961a84ccfab24b59139192a400936`\n- Pages and hosted-evidence artifact names are now run-attempt-specific.\n- `verify-hosted-fast.mjs` retries bounded transient HTTP/network failures with backoff.\n- Exact-current-main protection remains mandatory.\n\n## Production verification\n\n- Merged-main workflow run: `34871911910` (run #199)\n- Production release ID: `54bd2be14e728060b8534485a0a08cd5`\n- Hosted files: 344\n- Counts: 80 Gear / 57 KB / 5 Catches\n- Production bundle artifact: `10359767834`\n- Hosted-production verification artifact: `10359688366`\n- Production acceptance evidence artifact: `10359413355`\n- Pages artifact: `10359768064` (`github-pages-1`)\n\nThe full application lane passed durable-v1 recovery, dependency audit, core/preview validation, Chromium/WebKit acceptance, production build/verification, real v1 cutover acceptance, exact-current-main protection, Pages deployment, hosted byte verification and hosted browser acceptance.\n\n## Handoff consequence\n\nFISH109 is complete. The next unused application/architecture task ID is `FISH-TODO-110`. Routine Fast Content Releases still do not consume application task IDs.\n''')
          PY
          rm .github/workflows/tmp-fish109-handoff.yml
          git config user.name "Gino Sega"
          git config user.email "ginosega@gmail.com"
          git add README.md Fishing_Context.md Fishing_TODO.md Fishing_Decision_Log.md Fishing_New_Chat_Bootstrap_Prompt.md pwa/README.md pwa/docs/FISH109_Production_Closeout_2026-09-14.md .github/workflows/tmp-fish109-handoff.yml
          git commit -m "Reconcile FISH109 handoff state"
          git push origin HEAD:docs/fish109-handoff
