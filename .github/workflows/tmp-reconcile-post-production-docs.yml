name: Temporary reconcile post-production Fishing records
on:
  push:
    branches: [docs/reconcile-post-production-authoring-20260910]
permissions:
  contents: write
jobs:
  reconcile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Reconcile current project records
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          production = '26e6c9b3dcad25b10eae891871a7d8d873fdfedb'
          run = '34518842561'
          remaining = "Gear Rapala Original Floating F-3, Mack's Pee Wee Hoochie and River2Sea Whopper Plopper60; KB Perch, Popper and Whopper Plopper"

          def insert_after(path, marker, text):
              p=Path(path); s=p.read_text()
              if text.strip() in s: return
              if marker not in s: raise SystemExit(f'marker missing in {path}: {marker!r}')
              s=s.replace(marker, marker+text, 1)
              p.write_text(s)

          # README: add an overriding current-state block while retaining the dated cleanup/initial-release evidence below.
          insert_after('README.md', '# Fishing\n\n', f'''## Current production state — September 10, 2026\n\nFishing Companion production source `{production}` is published and hosted-verified by [production run {run}](https://github.com/ginosega/fishing/actions/runs/{run}). Routine site-authored changes after the initial v2 release updated the Pflueger President spincast rod (PR75), updated the matching reel (PR76), and supplied the Tsuridamashii ball-bearing snap-swivels picture (PR77). The Tsuridamashii picture is now part of canonical Gear source and production. Six of the original seven deferred required pictures remain: {remaining}. Generic inline-spinner remains optional. The cleanup and initial-release sections below are dated historical evidence; P2 remains deferred.\n\n''')

          # Context: add current authority, update the live picture/backlog statements, preserve historical release evidence.
          insert_after('Fishing_Context.md', '# Fishing Context\n\n', f'''## Current production state — September 10, 2026\n\nCurrent Fishing Companion production source is `{production}`, published and hosted-verified by [run {run}](https://github.com/ginosega/fishing/actions/runs/{run}). Post-production site-authored changes are PR75 (Pflueger spincast rod), PR76 (Pflueger spincast reel), and PR77 (Tsuridamashii ball-bearing snap-swivels picture). The supplied Tsuridamashii picture is now canonical and live. Six originally deferred required pictures remain: {remaining}. Generic inline-spinner remains optional. P2 remains deferred. Earlier cleanup/initial-release sections below remain dated historical evidence.\n\n''')
          p=Path('Fishing_Context.md'); s=p.read_text()
          old="The user explicitly approved absent pictures for Gear Tsuridamashii ball-bearing snap swivels, Rapala Original Floating F-3, Mack's Pee Wee Hoochie and River2Sea Whopper Plopper60, and KB Perch, Popper and Whopper Plopper. `pwa/migration/media-decisions.json` records that approval separately from the original seven-required/one-optional reconciliation report. Generic inline-spinner remains optional. The user will add pictures later. No automatic acquisition or adoption of the newer unapproved F-3 capture."
          new="The original production decision explicitly approved absence of seven required pictures and remains preserved in `pwa/migration/media-decisions.json` as historical migration disposition. The user later supplied and published the Tsuridamashii ball-bearing snap-swivels picture through PR77. Six required pictures remain deferred: Gear Rapala Original Floating F-3, Mack's Pee Wee Hoochie and River2Sea Whopper Plopper60, and KB Perch, Popper and Whopper Plopper. Generic inline-spinner remains optional. The user will supply pictures later; do not acquire them automatically or adopt the unapproved F-3 capture."
          if old not in s: raise SystemExit('Context picture paragraph changed unexpectedly')
          s=s.replace(old,new,1)
          old2="FISH071–076,079–082 are DONE; FISH077 is DEFERRED. FISH078 optional future picture additions are DEFERRED by user instruction. Unrelated fishing/equipment/content backlog is preserved; next unused ID is084. Continue in Chat using the current bootstrap. New work must restore actual latest main, use normal PR/CI for runtime changes and update authoritative records after actual milestones."
          new2="FISH071–076,079–083 are DONE; FISH077 is DEFERRED. FISH078 remains DEFERRED for the six still-missing required pictures; the Tsuridamashii snap-swivels picture was supplied and published through PR77. Unrelated fishing/equipment/content backlog is preserved; next unused ID is084. Continue in Chat using the current bootstrap. New work must restore actual latest main, use normal PR/CI for runtime changes and update authoritative records after actual milestones."
          if old2 not in s: raise SystemExit('Context backlog paragraph changed unexpectedly')
          p.write_text(s.replace(old2,new2,1))

          # TODO: add current production authority and reconcile FISH078 without creating a new task ID.
          insert_after('Fishing_TODO.md', '# Fishing TODO\n\n', f'''## Current production state — September 10, 2026\n\nCurrent Fishing Companion production source is `{production}`, published and hosted-verified by [run {run}](https://github.com/ginosega/fishing/actions/runs/{run}). PR77 added the user-supplied Tsuridamashii ball-bearing snap-swivels picture after PR75/PR76 updated the Pflueger spincast rod/reel. Six originally deferred required pictures remain: {remaining}. Generic inline-spinner remains optional. FISH078 stays DEFERRED for those remaining pictures; no new task ID is consumed.\n\n''')
          p=Path('Fishing_TODO.md'); s=p.read_text()
          old="| FISH-TODO-078 | P2 | DEFERRED | User approved leaving all seven formerly required pictures absent and will add them later. All Gear/KB items remain. Generic inline-spinner is optional. Original migration report is preserved; media-decisions.json records the new disposition. No automatic acquisition or adoption of unapproved F-3/new images. |"
          new="| FISH-TODO-078 | P2 | DEFERRED | Original production accepted seven required pictures as absent. The user later supplied and published the Tsuridamashii ball-bearing snap-swivels picture in PR77. Six remain deferred: Gear Rapala Original Floating F-3, Mack's Pee Wee Hoochie and River2Sea Whopper Plopper60; KB Perch, Popper and Whopper Plopper. Generic inline-spinner is optional. Preserve the original migration report/media-decisions as historical disposition; no automatic acquisition or adoption of unapproved F-3/new images. |"
          if old not in s: raise SystemExit('TODO FISH078 row changed unexpectedly')
          p.write_text(s.replace(old,new,1))

          # Decision log: record the later authoring milestone; do not rewrite historical production/media decisions.
          insert_after('Fishing_Decision_Log.md', '# Fishing Decision Log\n\n', f'''## Post-production authoring updates — September 10, 2026\n\nThe site-authored Prepare Changes → Copy Changes workflow has now been exercised through three routine production updates: PR75 updated the Pflueger President spincast rod, PR76 updated the matching reel, and PR77 added the user-supplied Tsuridamashii ball-bearing snap-swivels picture. Current production source `{production}` passed the full production pipeline and hosted verification in [run {run}](https://github.com/ginosega/fishing/actions/runs/{run}). The original decision accepting seven missing required pictures remains historical authority for the production cutover; PR77 subsequently resolved the Tsuridamashii exception. Six required pictures remain deferred: {remaining}. Generic inline-spinner remains optional. FISH078 remains DEFERRED for those six; P2 remains DEFERRED.\n\n''')
          p=Path('Fishing_Decision_Log.md'); s=p.read_text()
          old="The canonical TODO now tracks user preview review, required media resolution, separately authorized cutover and existing fishing/gear research. Engineering, automated acceptance and isolated publication are complete. FISH063's old media-authoring policy and FISH039's setup recording are superseded for v2; they do not justify reintroducing retired structures. PowerBait hook-size and loop-knot guidance remain unresolved. The next unused canonical task ID is FISH-TODO-084. No approved future feature is treated as already deployed."
          new="The canonical TODO tracks the six remaining user-supplied deferred pictures, separately authorized P2 work and existing fishing/gear research. Production cutover and automated/hosted acceptance are complete. FISH063's old media-authoring policy and FISH039's setup recording are superseded for v2; they do not justify reintroducing retired structures. PowerBait hook-size and loop-knot guidance remain unresolved. The next unused canonical task ID is FISH-TODO-084. No approved future feature is treated as already deployed."
          if old not in s: raise SystemExit('Decision open-work paragraph changed unexpectedly')
          p.write_text(s.replace(old,new,1))

          # Bootstrap: current-state section and source/scope must reflect latest production while dated cleanup remains historical.
          p=Path('Fishing_New_Chat_Bootstrap_Prompt.md'); s=p.read_text()
          start=s.index('## Current state and operating mode\n\n')
          end=s.index('I explicitly authorized production', start)
          current=f'''## Current state and operating mode\n\nV2 is published at [Fishing Companion](https://ginosega.github.io/fishing/). Current production source `{production}` passed the complete production pipeline and actual hosted verification in [run {run}](https://github.com/ginosega/fishing/actions/runs/{run}). Post-production site-authored changes are PR75 (Pflueger spincast rod), PR76 (Pflueger spincast reel) and PR77 (Tsuridamashii ball-bearing snap-swivels picture). The supplied Tsuridamashii picture is canonical and live. Six of the original seven deferred required pictures remain: {remaining}. Generic inline-spinner remains optional. No acceptance or media approval blocks routine releases.\n\nValidation remains the complete core/source build plus preview-scope and production-scope Chromium/WebKit scenarios, including the archived-v1 worker/store transition, followed by exact-current-main Pages deployment and actual hosted-byte/browser verification. These are automated browser/direct hosted checks, not physical-device inspection.\n\nThe sole active pipeline is `.github/workflows/fishing-production.yml`. V1 and the earlier preview are historical; use the production root. V1 sources are archived in Git history and the pre-cleanup checkpoint; exact rollback ZIPs remain in Git. Old browser stores are retained. P2 remains deferred. Continue in Chat.\n\n'''
          s=s[:start]+current+s[end:]
          old="The seven deferred pictures are Gear Tsuridamashii ball-bearing snap swivels, Rapala Original Floating F-3, Mack's Pee Wee Hoochie and River2Sea Whopper Plopper60; KB Perch, Popper and Whopper Plopper. Generic inline-spinner is optional. `pwa/migration/media-decisions.json` records explicit acceptance of their absence while the original migration report remains preserved. I will supply pictures later; do not acquire them automatically."
          new="The original seven-picture absence decision is historical production-cutover evidence. PR77 subsequently supplied and published the Tsuridamashii ball-bearing snap-swivels picture. Six required pictures remain deferred: Gear Rapala Original Floating F-3, Mack's Pee Wee Hoochie and River2Sea Whopper Plopper60; KB Perch, Popper and Whopper Plopper. Generic inline-spinner is optional. `pwa/migration/media-decisions.json` preserves the original accepted-absence disposition; do not reinterpret it as proof that a later-supplied canonical picture is absent. I will supply remaining pictures later; do not acquire them automatically."
          if old not in s: raise SystemExit('Bootstrap picture paragraph changed unexpectedly')
          s=s.replace(old,new,1)
          old2="The source-equivalence waiver stands; no separate physical-device/IndexedDB export or inspection is claimed. Retain old browser stores and reconcile later-discovered local-only data before retirement. FISH076 is DONE; FISH078 picture additions and P2 are DEFERRED. Unrelated backlog remains; next unused task ID084. Update Context, Decision Log, TODO, README, affected source/technical/release records and this bootstrap after actual milestones; cross-check before handoff."
          new2="The source-equivalence waiver stands; no separate physical-device/IndexedDB export or inspection is claimed. Retain old browser stores and reconcile later-discovered local-only data before retirement. FISH076 and FISH083 are DONE; FISH078 remains DEFERRED for the six remaining required pictures and P2 is DEFERRED. Unrelated backlog remains; next unused task ID084. Update Context, Decision Log, TODO, README, affected source/technical/release records and this bootstrap after actual milestones; cross-check before handoff."
          if old2 not in s: raise SystemExit('Bootstrap final status changed unexpectedly')
          p.write_text(s.replace(old2,new2,1))
          PY
          git diff --check
          git diff -- README.md Fishing_Context.md Fishing_TODO.md Fishing_Decision_Log.md Fishing_New_Chat_Bootstrap_Prompt.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md Fishing_Context.md Fishing_TODO.md Fishing_Decision_Log.md Fishing_New_Chat_Bootstrap_Prompt.md
          git commit -m 'Reconcile post-production Fishing authoring state'
          git push origin HEAD:${GITHUB_REF_NAME}
