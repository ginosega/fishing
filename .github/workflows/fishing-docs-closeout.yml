name: Fishing documentation closeout

on:
  push:
    branches:
      - docs/kb-authoring-closeout
    paths:
      - '.github/workflows/fishing-docs-closeout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  closeout:
    if: github.repository == 'ginosega/fishing' && github.ref == 'refs/heads/docs/kb-authoring-closeout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Verify source and apply exact documentation patch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 9aa14e0260b3ea5939ec4126077e574ab0782d70 HEAD
          test "$(git diff --name-only 9aa14e0260b3ea5939ec4126077e574ab0782d70 HEAD | sort)" = "$(printf '%s\n' '.github/workflows/fishing-docs-closeout.yml' 'pwa/_closeout/closeout.patch.xz.b64' | sort)"
          base64 --decode pwa/_closeout/closeout.patch.xz.b64 | xz --decompress > /tmp/fishing-closeout.patch
          echo '1797c70a74ba226cb8495efdfc588ec4cdf8ae78ca998aa96e8b7efaa55d8680  /tmp/fishing-closeout.patch' | sha256sum --check
          git apply --check /tmp/fishing-closeout.patch
          git apply --index /tmp/fishing-closeout.patch
          git diff --cached --check
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          expected = {'README.md','Fishing_Context.md','Fishing_TODO.md','Fishing_Decision_Log.md','Fishing_New_Chat_Bootstrap_Prompt.md','Fishing_Release_Handoff_2026-09-06.md','pwa/README.md'}
          changed = set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert changed == expected, changed
          root = Path('.')
          todo = (root/'Fishing_TODO.md').read_text()
          assert len(re.findall(r'^\| FISH-TODO-060 \|',todo,re.M)) == 1
          assert '| FISH-TODO-060 | P1 | IN PROGRESS' not in todo
          assert 'ARCHIVE-2026-09-06-HANDOFF' in todo
          for name in expected - {'Fishing_Release_Handoff_2026-09-06.md','Fishing_TODO.md'}:
              text = (root/name).read_text()
              assert '6d04e29b6770000eaa50f6c449ad82bc88f7326d' in text, name
              assert '34142574286' in text, name
          assert '## Active Backlog' in todo and '## Completed Items' in todo
          assert 'FISH-TODO-005' in todo and 'FISH-TODO-039' in todo
          print('Seven-file source reconciliation and canonical TODO checks passed.')
          PY
      - name: Commit reconciled records and remove transfer payload
        shell: bash
        run: |
          set -euo pipefail
          git rm pwa/_closeout/closeout.patch.xz.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Close KB authoring TODO and reconcile production release records'
          git push origin HEAD:refs/heads/docs/kb-authoring-closeout
