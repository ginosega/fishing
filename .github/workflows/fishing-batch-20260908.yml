name: One-time Fishing September 8 source promotion
on:
  push:
    branches: [feature/kayak-length-three-kb-images]
    paths: ['.github/workflows/fishing-batch-20260908.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  promote:
    if: github.repository == 'ginosega/fishing' && github.ref == 'refs/heads/feature/kayak-length-three-kb-images'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kayak-length-three-kb-images
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Promote exact authorized changes
        run: |
          set -euo pipefail
          node --check pwa/changes/2026-09-08-batch.mjs
          node pwa/changes/2026-09-08-batch.mjs
          node --check pwa/accepted-2026-09-08.test.mjs
          node pwa/accepted-2026-09-08.test.mjs
          node pwa/dagger-axis.test.mjs
          node pwa/gear-model.test.mjs
          node pwa/kb-model.test.mjs
          node pwa/kb-promotion.test.mjs
          node pwa/final-content.test.mjs
      - name: Commit source-only changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- pwa
          git diff --cached --check
          git commit -m 'Correct Dagger length and register three KB hero images'
          git push origin HEAD:refs/heads/feature/kayak-length-three-kb-images
