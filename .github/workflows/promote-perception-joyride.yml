name: Promote Perception Joyride and Rods caption

on:
  push:
    branches: [feature/perception-joyride-rods-caption]
    paths: ['.github/workflows/promote-perception-joyride.yml']

permissions:
  contents: write

jobs:
  promote:
    if: github.repository == 'ginosega/fishing' && github.ref == 'refs/heads/feature/perception-joyride-rods-caption'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Promote validated handoffs
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const write=(p,v)=>fs.writeFileSync(p,JSON.stringify(v,null,2)+'\n');
          const gear=read('pwa/data/gear.seed.json');
          const kb=read('pwa/data/kb.seed.json');
          const local=read('pwa/local-media.json');
          const sources=read('pwa/media-sources.json');
          const owners=read('pwa/media-owners.json');
          if(gear.schemaVersion!==4||gear.dataVersion!=='2026-09-08-my-gear-v4-dagger-length-1') throw Error('Unexpected Gear base');
          if(kb.schemaVersion!==1||kb.dataVersion!=='2026-09-08-kb-v1-three-hero-images-1') throw Error('Unexpected KB base');
          const id='perception-joyride-10-0';
          const url='https://www.perception-kayaks.com/product/perception-joyride-10-sit-inside-kayak-for-adults-and-kids-recreational-and-multi-water-kayak-with-selfie-slot-10dapper/';
          const item={id,category:'accessories',type:'Accessories',name:'Perception Joyride 10.0',manufacturer:{name:'Perception'},model:'Joyride 10.0',specifications:[{label:'Length',value:"10'"},{label:'Height',value:'15.25"'},{label:'Width',value:'28.5"'},{label:'Weight',value:'50 lb'},{label:'Color',value:'Funkadelic'}],links:[{label:'Perception',url}]};
          if(gear.items.some(x=>x.id===id)) throw Error('Joyride ID already exists');
          gear.items.push(item);
          gear.dataVersion='2026-09-08-my-gear-v4-perception-joyride-1';
          if(sources.items.some(x=>x.id===id)||owners.items.some(x=>x.mediaId===id)||local.gear.some(x=>x.mediaId===id)) throw Error('Joyride media already registered');
          sources.items.push({id,aliases:['Perception Joyride 10.0','Joyride 10.0'],sourcePage:url,destination:url,alt:'Perception Joyride 10.0 kayak'});
          owners.items.push({mediaId:id,owners:[{gearItemId:id}]});
          local.gear.push({mediaId:id,source:'./assets/gear-source/perception-joyride-10.png',alt:'Perception Joyride 10.0 kayak',destination:url,sourcePage:url,owners:[{gearItemId:id}]});
          const rods=kb.entities.find(x=>x.id==='technique-rods-reels');
          const rodsLocal=local.kb.find(x=>x.entityId==='technique-rods-reels');
          if(!rods||!rods.picture||rods.picture.src!=='./assets/kb/entries/technique-rods-reels.png'||!rodsLocal) throw Error('Unexpected Rods & Reels base');
          rods.picture.caption='Baitcasting reel';
          rodsLocal.caption='Baitcasting reel';
          kb.dataVersion='2026-09-08-kb-v1-rods-reels-caption-1';
          write('pwa/data/gear.seed.json',gear); write('pwa/data/kb.seed.json',kb); write('pwa/local-media.json',local); write('pwa/media-sources.json',sources); write('pwa/media-owners.json',owners);

          const replaceAll=(p,a,b)=>{let s=fs.readFileSync(p,'utf8'); if(!s.includes(a)) throw Error(`Missing ${a} in ${p}`); fs.writeFileSync(p,s.split(a).join(b));};
          for(const p of ['pwa/dagger-axis.test.mjs','pwa/accepted-2026-09-08.test.mjs','pwa/gear-model.test.mjs','pwa/final-content.test.mjs']) replaceAll(p,'2026-09-08-my-gear-v4-dagger-length-1','2026-09-08-my-gear-v4-perception-joyride-1');
          for(const p of ['pwa/accepted-2026-09-08.test.mjs','pwa/final-content.test.mjs']) replaceAll(p,'2026-09-08-kb-v1-three-hero-images-1','2026-09-08-kb-v1-rods-reels-caption-1');
          for(const p of ['pwa/dagger-axis.test.mjs','pwa/accepted-2026-09-08.test.mjs']) replaceAll(p,'items.length,65','items.length,66');
          let accepted=fs.readFileSync('pwa/accepted-2026-09-08.test.mjs','utf8');
          accepted=accepted.replace('"id":"technique-rods-reels","name":"Rods & Reels","description":"Spinning and baitcasting selection, setup, adjustment, and casting guidance.","path":"./kb-content/techniques/rods-reels.md","filename":"technique-rods-reels.png","alt":"Baitcasting reel","markdownBlob"','"id":"technique-rods-reels","name":"Rods & Reels","description":"Spinning and baitcasting selection, setup, adjustment, and casting guidance.","path":"./kb-content/techniques/rods-reels.md","filename":"technique-rods-reels.png","alt":"Baitcasting reel","caption":"Baitcasting reel","markdownBlob"');
          accepted=accepted.replace('const desired={src,alt:p.alt,caption:null,credit:null,sourceUrl:null,...(p.gearItemId?{gearItemId:p.gearItemId}:{})};','const desired={src,alt:p.alt,caption:p.caption??null,credit:null,sourceUrl:null,...(p.gearItemId?{gearItemId:p.gearItemId}:{})};');
          accepted=accepted.replace('assert.deepEqual(local.kb.filter(x=>x.entityId===p.id),[{entityId:p.id,source:src,alt:p.alt,caption:null,credit:null,sourceUrl:null,...(p.gearItemId?{gearItemId:p.gearItemId}:{})}]);','assert.deepEqual(local.kb.filter(x=>x.entityId===p.id),[{entityId:p.id,source:src,alt:p.alt,caption:p.caption??null,credit:null,sourceUrl:null,...(p.gearItemId?{gearItemId:p.gearItemId}:{})}]);');
          if(!accepted.includes('"caption":"Baitcasting reel","markdownBlob"')||!accepted.includes('caption:p.caption??null')) throw Error('Failed to update accepted image regression');
          fs.writeFileSync('pwa/accepted-2026-09-08.test.mjs',accepted);

          const test=`import assert from 'node:assert/strict';\nimport fs from 'node:fs';\nimport crypto from 'node:crypto';\nimport {fileURLToPath} from 'node:url';\nimport {validateGearBundle} from './gear-model.js';\nimport {validateKbBundle,validateCatchBundle} from './kb-model.js';\nimport {readValidatedImage} from './image-validation.mjs';\nconst read=p=>JSON.parse(fs.readFileSync(new URL(p,import.meta.url),'utf8'));\nconst gear=read('./data/gear.seed.json'),kb=read('./data/kb.seed.json'),catches=read('./data/catches.seed.json'),sources=read('./media-sources.json'),owners=read('./media-owners.json'),local=read('./local-media.json');\nassert.ok(validateGearBundle(gear).valid); assert.ok(validateKbBundle(kb).valid); assert.ok(validateCatchBundle(catches,kb,gear).valid);\nassert.equal(gear.dataVersion,'2026-09-08-my-gear-v4-perception-joyride-1'); assert.equal(kb.dataVersion,'2026-09-08-kb-v1-rods-reels-caption-1'); assert.equal(gear.items.length,66);\nconst id='perception-joyride-10-0'; const expected=${JSON.stringify(item)}; assert.deepEqual(gear.items.filter(x=>x.id===id),[expected]); assert.equal(fs.existsSync(new URL('./gear-content/'+id+'.md',import.meta.url)),false);\nassert.deepEqual(owners.items.find(x=>x.mediaId===id).owners,[{gearItemId:id}]); const source=sources.items.find(x=>x.id===id); assert.equal(source.destination,expected.links[0].url); assert.equal(source.sourcePage,expected.links[0].url);\nconst entry=local.gear.find(x=>x.mediaId===id); assert.equal(entry.source,'./assets/gear-source/perception-joyride-10.png'); assert.deepEqual(entry.owners,[{gearItemId:id}]);\nconst bytes=await readValidatedImage(fileURLToPath(new URL(entry.source,import.meta.url))); const blob=crypto.createHash('sha1').update('blob '+bytes.length+'\\0').update(bytes).digest('hex'); assert.equal(blob,'f24403f79788755e267ee721f5e93c34c3f8f472'); assert.equal(bytes.length,562530);\nconst rods=kb.entities.find(x=>x.id==='technique-rods-reels'); assert.equal(rods.picture.caption,'Baitcasting reel'); assert.equal(rods.picture.alt,'Baitcasting reel'); assert.equal(local.kb.find(x=>x.entityId==='technique-rods-reels').caption,'Baitcasting reel');\nif(process.argv.includes('--dist')){const builtGear=read('./dist/data/gear.seed.json'),builtKb=read('./dist/data/kb.seed.json'); assert.deepEqual(builtGear.items.find(x=>x.id===id),expected); assert.equal(builtKb.entities.find(x=>x.id==='technique-rods-reels').picture.caption,'Baitcasting reel'); const media=read('./dist/gear-media.json').find(x=>x.id===id); assert.ok(media); assert.equal(media.asset,'./assets/gear/perception-joyride-10-0.png'); assert.deepEqual(media.owners,[{gearItemId:id}]); assert.equal(media.localSource,true); assert.equal(media.sourcePath,'pwa/assets/gear-source/perception-joyride-10.png'); assert.deepEqual(fs.readFileSync(new URL('./dist/assets/gear/perception-joyride-10-0.png',import.meta.url)),bytes);}\nconsole.log('Perception Joyride add and Rods & Reels caption checks passed.');\n`;
          fs.writeFileSync('pwa/accepted-2026-09-08-joyride-caption.test.mjs',test);
          NODE
          node pwa/accepted-2026-09-08-joyride-caption.test.mjs
          node pwa/accepted-2026-09-08.test.mjs
          node pwa/dagger-axis.test.mjs
          node pwa/gear-model.test.mjs
          node pwa/kb-model.test.mjs
          node pwa/final-content.test.mjs
      - name: Commit promoted sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Fishing release bot'
          git config user.email 'actions@users.noreply.github.com'
          git add pwa/data/gear.seed.json pwa/data/kb.seed.json pwa/local-media.json pwa/media-sources.json pwa/media-owners.json pwa/dagger-axis.test.mjs pwa/accepted-2026-09-08.test.mjs pwa/gear-model.test.mjs pwa/final-content.test.mjs pwa/accepted-2026-09-08-joyride-caption.test.mjs
          git commit -m 'Promote Perception Joyride and Rods & Reels caption'
          git push origin HEAD:feature/perception-joyride-rods-caption
