name: FISH099 project-state reconciliation

on:
  push:
    branches:
      - docs/fish099-closeout

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source and reconcile records
        run: |
          test "$(git rev-parse origin/main)" = "9899849be676e971e3670fe72eba7ffd66986d68"
          python .github/scripts/fish099-docs-closeout.py
      - name: Commit reconciled records and remove temporary helpers
        run: |
          rm .github/scripts/fish099-docs-closeout.py
          rm .github/workflows/fish099-docs-closeout.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Docs: close out FISH099 production release"
          git push origin HEAD:${GITHUB_REF_NAME}
