name: Fishing v2 source audit

on:
  push:
    branches:
      - audit/v2-phase1-20260908
    paths:
      - 'tools/v2-audit/**'
      - '.github/workflows/v2-source-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inventory exact repository source
        run: python tools/v2-audit/scan.py
      - name: Upload source audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: fishing-v2-source-audit
          path: audit-output/
          retention-days: 30
