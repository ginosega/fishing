name: Temporary trailing whitespace guidance update

on:
  push:
    branches:
      - docs/trailing-whitespace-rule
    paths:
      - .fish-docs-whitespace-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add durable trailing whitespace rule
        run: |
          python3 -c "from pathlib import Path; p=Path('Fishing_Context.md'); s=p.read_text(); a='- apply only the requested canonical changes;\\n'; b=a+'- normalize accidental trailing whitespace: remove trailing spaces from package string values and text lines unless the user explicitly instructs that the whitespace be preserved;\\n'; assert s.count(a)==1, s.count(a); p.write_text(s.replace(a,b,1))"
          python3 -c "from pathlib import Path; p=Path('Fishing_New_Chat_Bootstrap_Prompt.md'); s=p.read_text(); a='Before mutation, still restore actual current source and validate the package: source revision/ancestry as appropriate, record hash/base fields for edits, conflict state, IDs/schema/types/paths/references, notes/media actions, and supplied media existence/hash where applicable. Apply only requested changes and preserve unrelated source/user bytes.\\n'; b=a+'\\nNormalize accidental trailing whitespace before mutation: remove trailing spaces from package string values and text lines by default unless the user explicitly instructs that the whitespace be preserved. This normalization does not authorize unrelated wording/content changes or media substitution.\\n'; assert s.count(a)==1, s.count(a); p.write_text(s.replace(a,b,1))"
          python3 -c "from pathlib import Path; p=Path('Fishing_Decision_Log.md'); s=p.read_text(); a='Simple Markdown-only narrative edits to existing canonical files may be made directly in GitHub. Structured record fields, categories/types, specifications, structured links, picture metadata/sequences, paths and relationships should use Fishing Companion Edit or an equivalent source-aware workflow.\\n'; b=a+'\\n### Authoring whitespace normalization\\n\\n**Decision:** Treat accidental trailing whitespace in Fishing Companion change packages as non-semantic by default. Remove trailing spaces from structured text values and text lines before applying them unless the user explicitly instructs that the whitespace be preserved. This normalization does not authorize unrelated wording/content changes or media substitution.\\n'; assert s.count(a)==1, s.count(a); p.write_text(s.replace(a,b,1))"
          git rm -f .github/workflows/tmp-docs-trailing-whitespace-rule.yml .fish-docs-whitespace-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Fishing_Context.md Fishing_New_Chat_Bootstrap_Prompt.md Fishing_Decision_Log.md
          git commit -m "Document trailing whitespace normalization"
          git push origin HEAD:docs/trailing-whitespace-rule
