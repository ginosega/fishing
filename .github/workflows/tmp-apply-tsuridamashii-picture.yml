name: Temporary apply Tsuridamashii picture package
on:
  push:
    branches: [feature/add-tsuridamashii-snap-swivels-picture-20260910]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Apply verified picture change
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const p = 'Gear/gear.json';
          const imagePath = 'Gear/Snaps-Swivels/assets/Tsuridamashii Ball-Bearing Snap Swivels.png';
          const bytes = fs.readFileSync(imagePath);
          if (bytes.length !== 1154685) throw new Error(`Image byte mismatch: ${bytes.length}`);
          const sha = crypto.createHash('sha256').update(bytes).digest('hex');
          if (sha !== '66c6e6b27392f904e1cd7d890375d0a54270afd9d5ea16c4c488015270cb9c38') throw new Error(`Image SHA-256 mismatch: ${sha}`);
          const data = JSON.parse(fs.readFileSync(p, 'utf8'));
          const r = data.items.find(x => x.id === 'tsuridamashii-ball-bearing-snap-swivels');
          if (!r) throw new Error('Target gear record missing');
          const expected = {
            id: 'tsuridamashii-ball-bearing-snap-swivels',
            category: 'snaps-swivels',
            type: 'Snap swivels',
            name: 'Tsuridamashii ball-bearing snap swivels',
            manufacturer: 'Tsuridamashii',
            model: 'Ball-bearing snap swivels',
            specifications: [
              {label:'Size',value:'0'},
              {label:'Rating',value:'55 lb'},
              {label:'Quantity',value:'20-pack'}
            ],
            links: [{label:'Amazon',url:'https://a.co/d/apPLB6U'}],
            notes: 'Gear/Snaps-Swivels/content/tsuridamashii-ball-bearing-snap-swivels.md'
          };
          if (JSON.stringify(r) !== JSON.stringify(expected)) throw new Error('Base record conflict');
          r.picture = {
            src: imagePath,
            caption: 'Tsuridamashii ball-bearing snap swivels'
          };
          fs.writeFileSync(p, JSON.stringify(data, null, 2) + '\n');
          NODE
          git diff --check
          git diff -- Gear/gear.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Gear/gear.json
          git commit -m 'Add Tsuridamashii snap swivels picture [applied]'
          git push origin HEAD:${GITHUB_REF_NAME}
