name: Temporary reconcile production state
on:
  push:
    branches: [docs/reconcile-production-state-20260910]
permissions:
  contents: write
jobs:
  reconcile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Reconcile current authority documents
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          source='00afdd15649d7f6b0231beb0ed4febc2bd495a4b'
          run='34540254684'
          release='fe99694ea8dce031bb9a149fac8440dd'

          def replace_first_section_paragraph(path, heading, paragraph):
              p=Path(path); s=p.read_text()
              marker=heading+'\n\n'
              i=s.find(marker)
              assert i>=0, (path,heading)
              start=i+len(marker)
              end=s.find('\n\n',start)
              assert end>=0, (path,'paragraph end')
              s=s[:start]+paragraph+s[end:]
              p.write_text(s)

          current=(
            f'Fishing Companion production source `{source}` is published and hosted-verified by [production run {run}](https://github.com/ginosega/fishing/actions/runs/{run}); release `{release}` matched all 203 hosted files and passed production navigation, image-viewer, complete-offline-reload and record-count checks. Routine site-authored updates now include PR75/PR76 (Pflueger spincast rod/reel), PR77 (Tsuridamashii snap-swivels picture), PR79 (Rapala Original Floating, Mack\'s Pee Wee Hoochie, River2Sea Whopper Plopper 60 and Yellow Perch pictures plus the Rebel Pop-R picture replacement), and PR81 (Kokanee, Largemouth Bass and Smallmouth Bass Species picture/content updates). Only two of the original required pictures remain deferred: KB Popper and KB Whopper Plopper. Generic inline-spinner remains optional. The cleanup and initial-release sections below are dated historical evidence; P2 remains deferred.'
          )
          replace_first_section_paragraph('README.md','## Current production state — September 10, 2026',current)

          context=(
            f'Current Fishing Companion production source is `{source}`, published and hosted-verified by [run {run}](https://github.com/ginosega/fishing/actions/runs/{run}); release `{release}` matched all 203 hosted files and passed production navigation, image-viewer, complete-offline-reload and record-count checks. Post-production site-authored changes now include PR75/PR76 (Pflueger spincast rod/reel), PR77 (Tsuridamashii snap-swivels picture), PR79 (four previously deferred pictures plus the Rebel Pop-R replacement), and PR81 (Kokanee, Largemouth Bass and Smallmouth Bass Species picture/content updates). Only two originally deferred required pictures remain: KB Popper and KB Whopper Plopper. Generic inline-spinner remains optional. P2 remains deferred. Earlier cleanup/initial-release sections below remain dated historical evidence.'
          )
          replace_first_section_paragraph('Fishing_Context.md','## Current production state — September 10, 2026',context)

          p=Path('Fishing_Context.md'); s=p.read_text()
          old="The original production decision explicitly approved absence of seven required pictures and remains preserved in `pwa/migration/media-decisions.json` as historical migration disposition. The user later supplied and published the Tsuridamashii ball-bearing snap-swivels picture through PR77. Six required pictures remain deferred: Gear Rapala Original Floating F-3, Mack's Pee Wee Hoochie and River2Sea Whopper Plopper60, and KB Perch, Popper and Whopper Plopper. Generic inline-spinner remains optional. The user will supply pictures later; do not acquire them automatically or adopt the unapproved F-3 capture."
          new="The original production decision explicitly approved absence of seven required pictures and remains preserved in `pwa/migration/media-decisions.json` as historical migration disposition. The user later supplied Tsuridamashii through PR77 and Rapala Original Floating, Mack's Pee Wee Hoochie, River2Sea Whopper Plopper 60 and Yellow Perch through PR79. Only two required pictures remain deferred: KB Popper and KB Whopper Plopper. Generic inline-spinner remains optional. The user will supply remaining pictures later; do not acquire them automatically or reinterpret the historical migration disposition as current absence."
          assert s.count(old)==1, ('context pictures',s.count(old)); s=s.replace(old,new,1)
          old="FISH071–076,079–083 are DONE; FISH077 is DEFERRED. FISH078 remains DEFERRED for the six still-missing required pictures; the Tsuridamashii snap-swivels picture was supplied and published through PR77. Unrelated fishing/equipment/content backlog is preserved; next unused ID is084. Continue in Chat using the current bootstrap. New work must restore actual latest main, use normal PR/CI for runtime changes and update authoritative records after actual milestones."
          new="FISH071–076,079–083 are DONE; FISH077 is DEFERRED. FISH078 remains DEFERRED for the two still-missing required pictures: KB Popper and KB Whopper Plopper. Tsuridamashii was supplied through PR77 and four additional missing pictures through PR79. Unrelated fishing/equipment/content backlog is preserved; next unused ID is084. Continue in Chat using the current bootstrap. New work must restore actual latest main, use normal PR/CI for runtime changes and update authoritative records after actual milestones."
          assert s.count(old)==1, ('context backlog',s.count(old)); s=s.replace(old,new,1); p.write_text(s)

          todo=(
            f'Current Fishing Companion production source is `{source}`, published and hosted-verified by [run {run}](https://github.com/ginosega/fishing/actions/runs/{run}); release `{release}` matched all 203 hosted files. PR77 supplied the Tsuridamashii ball-bearing snap-swivels picture; PR79 supplied Rapala Original Floating, Mack\'s Pee Wee Hoochie, River2Sea Whopper Plopper 60 and Yellow Perch pictures and replaced Rebel Pop-R; PR81 updated Kokanee, Largemouth Bass and Smallmouth Bass Species picture/content. Only two originally deferred required pictures remain: KB Popper and KB Whopper Plopper. Generic inline-spinner remains optional. FISH078 stays DEFERRED for those two; no new task ID is consumed.'
          )
          replace_first_section_paragraph('Fishing_TODO.md','## Current production state — September 10, 2026',todo)
          p=Path('Fishing_TODO.md'); s=p.read_text()
          lines=s.splitlines()
          matches=[i for i,l in enumerate(lines) if l.startswith('| FISH-TODO-078 |')]
          assert len(matches)==1, matches
          lines[matches[0]]="| FISH-TODO-078 | P2 | DEFERRED | Original production accepted seven required pictures as absent. Tsuridamashii was later supplied in PR77; PR79 supplied Rapala Original Floating F-3, Mack's Pee Wee Hoochie, River2Sea Whopper Plopper 60 and Yellow Perch. Two remain deferred: KB Popper and KB Whopper Plopper. Generic inline-spinner is optional. Preserve original migration/media decisions as historical disposition; do not automatically acquire remaining images. |"
          p.write_text('\n'.join(lines)+'\n')

          decision=(
            f'The site-authored Prepare Changes → Copy Changes workflow has now been exercised through routine production updates including PR75/PR76 (Pflueger spincast rod/reel), PR77 (Tsuridamashii snap-swivels picture), PR79 (four previously deferred pictures plus Rebel Pop-R replacement), and PR81 (Kokanee, Largemouth Bass and Smallmouth Bass Species picture/content updates). Current production source `{source}` passed the full production pipeline and hosted verification in [run {run}](https://github.com/ginosega/fishing/actions/runs/{run}); release `{release}` matched all 203 hosted files. The original decision accepting seven missing required pictures remains historical authority for the cutover, while later user-supplied images have resolved five of those exceptions. Two required pictures remain deferred: KB Popper and KB Whopper Plopper. Generic inline-spinner remains optional. FISH078 remains DEFERRED for those two; P2 remains DEFERRED.'
          )
          replace_first_section_paragraph('Fishing_Decision_Log.md','## Post-production authoring updates — September 10, 2026',decision)

          p=Path('Fishing_New_Chat_Bootstrap_Prompt.md'); s=p.read_text()
          old="V2 is published at [Fishing Companion](https://ginosega.github.io/fishing/). Current production source `26e6c9b3dcad25b10eae891871a7d8d873fdfedb` passed the complete production pipeline and actual hosted verification in [run 34518842561](https://github.com/ginosega/fishing/actions/runs/34518842561). Post-production site-authored changes are PR75 (Pflueger spincast rod), PR76 (Pflueger spincast reel) and PR77 (Tsuridamashii ball-bearing snap-swivels picture). The supplied Tsuridamashii picture is canonical and live. Six of the original seven deferred required pictures remain: Gear Rapala Original Floating F-3, Mack's Pee Wee Hoochie and River2Sea Whopper Plopper60; KB Perch, Popper and Whopper Plopper. Generic inline-spinner remains optional. No acceptance or media approval blocks routine releases."
          new=f"V2 is published at [Fishing Companion](https://ginosega.github.io/fishing/). Current production source `{source}` passed the complete production pipeline and actual hosted verification in [run {run}](https://github.com/ginosega/fishing/actions/runs/{run}); release `{release}` matched all 203 hosted files. Post-production site-authored changes include PR75/PR76 (Pflueger spincast rod/reel), PR77 (Tsuridamashii snap-swivels picture), PR79 (four previously deferred pictures plus Rebel Pop-R replacement), and PR81 (Kokanee, Largemouth Bass and Smallmouth Bass Species picture/content updates). Only two of the original seven deferred required pictures remain: KB Popper and KB Whopper Plopper. Generic inline-spinner remains optional. No acceptance or media approval blocks routine releases."
          assert s.count(old)==1, ('bootstrap current',s.count(old)); s=s.replace(old,new,1)
          old="The original seven-picture absence decision is historical production-cutover evidence. PR77 subsequently supplied and published the Tsuridamashii ball-bearing snap-swivels picture. Six required pictures remain deferred: Gear Rapala Original Floating F-3, Mack's Pee Wee Hoochie and River2Sea Whopper Plopper60; KB Perch, Popper and Whopper Plopper. Generic inline-spinner is optional. `pwa/migration/media-decisions.json` preserves the original accepted-absence disposition; do not reinterpret it as proof that a later-supplied canonical picture is absent. I will supply remaining pictures later; do not acquire them automatically."
          new="The original seven-picture absence decision is historical production-cutover evidence. PR77 subsequently supplied Tsuridamashii; PR79 supplied Rapala Original Floating, Mack's Pee Wee Hoochie, River2Sea Whopper Plopper 60 and Yellow Perch. Two required pictures remain deferred: KB Popper and KB Whopper Plopper. Generic inline-spinner is optional. `pwa/migration/media-decisions.json` preserves the original accepted-absence disposition; do not reinterpret it as proof that a later-supplied canonical picture is absent. I will supply remaining pictures later; do not acquire them automatically."
          assert s.count(old)==1, ('bootstrap pictures',s.count(old)); s=s.replace(old,new,1)
          old="The source-equivalence waiver stands; no separate physical-device/IndexedDB export or inspection is claimed. Retain old browser stores and reconcile later-discovered local-only data before retirement. FISH076 and FISH083 are DONE; FISH078 remains DEFERRED for the six remaining required pictures and P2 is DEFERRED. Unrelated backlog remains; next unused task ID084. Update Context, Decision Log, TODO, README, affected source/technical/release records and this bootstrap after actual milestones; cross-check before handoff."
          new="The source-equivalence waiver stands; no separate physical-device/IndexedDB export or inspection is claimed. Retain old browser stores and reconcile later-discovered local-only data before retirement. FISH076 and FISH083 are DONE; FISH078 remains DEFERRED for the two remaining required pictures (KB Popper and KB Whopper Plopper) and P2 is DEFERRED. Unrelated backlog remains; next unused task ID084. Update Context, Decision Log, TODO, README, affected source/technical/release records and this bootstrap after actual milestones; cross-check before handoff."
          assert s.count(old)==1, ('bootstrap tail',s.count(old)); s=s.replace(old,new,1); p.write_text(s)
          PY
          git diff --check
          git diff -- README.md Fishing_Context.md Fishing_TODO.md Fishing_Decision_Log.md Fishing_New_Chat_Bootstrap_Prompt.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md Fishing_Context.md Fishing_TODO.md Fishing_Decision_Log.md Fishing_New_Chat_Bootstrap_Prompt.md
          git commit -m 'Reconcile current Fishing production state'
          git push origin HEAD:${GITHUB_REF_NAME}
