name: Materialize Recovery B Gear seed

on:
  push:
    branches:
      - ui/recovery-b-content-20260903
    paths:
      - 'pwa/materialize-recovery-b.mjs'
      - '.github/workflows/recovery-b-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/recovery-b-content-20260903
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize Gear seed
        run: node pwa/materialize-recovery-b.mjs
      - name: Commit materialized seed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pwa/data/gear.seed.json
          if git diff --cached --quiet; then
            echo 'Gear seed already materialized.'
            exit 0
          fi
          git commit -m 'Materialize Recovery B Gear seed [skip ci]'
          git push origin HEAD:ui/recovery-b-content-20260903
