name: FISH106 one-shot helper

on:
  push:
    branches:
      - feature/fish106-gear-tools-storage

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'FISH106: add six Gear records') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append six canonical Gear records
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('pwa/Gear/gear.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['schemaVersion'] == 2
          new_items = [
            {
              'id': 'kastking-brutus-silicone-foldable-extendable-net',
              'name': 'KastKing Brutus Silicone Foldable Extendable Net',
              'category': 'accessories',
              'type': 'Tools',
              'specifications': [
                {'value': '45"', 'label': 'Extended length'},
                {'value': "20'' x 16'' x 10''", 'label': 'Hoop Size'},
              ],
              'links': [
                {'label': 'KastKing', 'url': 'https://kastking.com/products/kastking-brutus-fishing-net'},
                {'label': 'Amazon', 'url': 'https://a.co/d/02NEAcJu'},
              ],
              'manufacturer': 'KastKing',
              'model': 'Brutus Silicone Foldable Extendable Net',
              'notes': 'Gear/Equipment/content/KastKing Brutus Silicone Foldable Extendable Net.md',
              'picture': {
                'src': 'Gear/Equipment/assets/KastKing Brutus Silicone Foldable Extendable Net.png',
                'caption': 'KastKing Brutus Silicone Foldable Extendable Net',
              },
            },
            {
              'id': 'kastking-cutthroat-7-stainless-steel-pliers',
              'name': 'KastKing Cutthroat 7" Stainless Steel Pliers',
              'category': 'accessories',
              'type': 'Tools',
              'specifications': [],
              'links': [
                {'label': 'KastKing', 'url': 'https://kastking.com/products/kastking-cutthroat-7-fishing-pliers'},
                {'label': 'Amazon', 'url': 'https://a.co/d/01v4khso'},
              ],
              'manufacturer': 'KastKing',
              'model': 'Cutthroat 7" Stainless Steel Pliers',
              'notes': 'Gear/Equipment/content/KastKing Cutthroat 7 Stainless Steel Pliers.md',
              'picture': {
                'src': 'Gear/Equipment/assets/KastKing Cutthroat 7-in Stainless Steel Pliers.png',
                'caption': 'KastKing Cutthroat 7" Stainless Steel Pliers',
              },
            },
            {
              'id': 'skylety-fishing-hook-sharpener',
              'name': 'Skylety Fishing Hook Sharpener',
              'category': 'accessories',
              'type': 'Kayaks',
              'specifications': [
                {'value': 'Orange', 'label': 'Color'},
              ],
              'links': [
                {'label': 'Amazon', 'url': 'https://a.co/d/0fazvrfJ'},
              ],
              'manufacturer': 'Skylety',
              'model': 'Fishing Hook Sharpener File Double Sided',
              'picture': {
                'src': 'Gear/Equipment/assets/Skylety Fishing Hook Sharpener.png',
                'caption': 'Skylety Fishing Hook Sharpener',
              },
            },
            {
              'id': 'plano-sportsman-s-trunk',
              'name': "Plano Sportsman's Trunk",
              'category': 'accessories',
              'type': 'Storage',
              'specifications': [
                {'value': 'Large', 'label': 'Size'},
                {'value': 'Blaze Orange', 'label': 'Color'},
                {'value': '37.25"L x 18"W x 14"H', 'label': 'Exterior Dimensions'},
                {'value': 'PLAT19BOE', 'label': 'Model #'},
              ],
              'links': [
                {'label': 'Plano', 'url': 'https://www.planooutdoors.com/collections/storage-trunks/products/sportsmans-trunk-large-1610260?variant=58749608755360'},
              ],
              'manufacturer': 'Plano',
              'model': "Sportsman's Trunk",
              'picture': {
                'src': "Gear/Equipment/assets/Plano Sportsman's Trunk.png",
                'caption': "Plano Sportsman's Trunk",
              },
            },
            {
              'id': 'kastking-v10-pivot-grip-fishing-rod-holder',
              'name': 'KastKing V10 Pivot Grip Fishing Rod Holder',
              'category': 'accessories',
              'type': 'Storage',
              'specifications': [],
              'links': [
                {'label': 'KastKing', 'url': 'https://kastking.com/products/kastking-v10-pivot-grip-fishing-rod-holder?_gl=1*119a5dr*_up*MQ..*_ga*MTgwNTQ5NTkxNS4xNzg5MzYxMzUy*_ga_Q8C72SQ60L*czE3ODkzNjEzNTEkbzEkZzEkdDE3ODkzNjEzODEkajMwJGwwJGg0OTA5OTk0NjI.'},
                {'label': 'Amazon', 'url': 'https://a.co/d/0d0mp0pp'},
              ],
              'manufacturer': 'KastKing',
              'model': 'V10 Pivot Grip Fishing Rod Holder',
              'picture': {
                'src': 'Gear/Equipment/assets/KastKing V10 Pivot Grip Fishing Rod Holder.png',
                'caption': 'KastKing V10 Pivot Grip Fishing Rod Holder',
              },
            },
            {
              'id': 'palmyth-flexible-fishing-gloves',
              'name': 'Palmyth Flexible Fishing Gloves',
              'category': 'accessories',
              'type': 'Accessories',
              'specifications': [
                {'value': 'Large', 'label': 'Size'},
                {'value': 'Black/Grey', 'label': 'Color'},
              ],
              'links': [
                {'label': 'Amazon', 'url': 'https://a.co/d/09qfUqMw'},
              ],
              'manufacturer': 'Palmyth',
              'model': 'Flexible Fishing Gloves',
              'picture': {
                'src': 'Gear/Equipment/assets/Palmyth Flexible Fishing Gloves.png',
                'caption': 'Palmyth Flexible Fishing Gloves',
              },
            },
          ]

          existing = {item['id'] for item in data['items']}
          duplicates = [item['id'] for item in new_items if item['id'] in existing]
          assert not duplicates, f'duplicate ids: {duplicates}'
          data['items'].extend(new_items)
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          git rm .github/workflows/fish106-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pwa/Gear/gear.json
          git commit -m "FISH106: add six Gear records"
          git push origin HEAD:feature/fish106-gear-tools-storage
