name: Fishing Gear Guides migration
on:
  push:
    branches:
      - feature/gear-guides-ordered-links
    paths:
      - '.github/workflows/fishing-gear-guides-migration.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gear-guides-ordered-links
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply approved Notes media changes
        run: |
          node pwa/migrate-gear-notes-media.mjs
          node --check pwa/gear-app.js
          node --check pwa/apply-authored-notes.mjs
          node --check pwa/apply-local-media.mjs
          node --check pwa/image-validation.mjs
          node pwa/gear-media-policy.test.mjs
          node pwa/gear-model.test.mjs
          node pwa/my-gear-routing.test.mjs
          node pwa/kb-model.test.mjs
          node pwa/kb-routing.test.mjs
          node pwa/final-content.test.mjs
      - name: Commit validated source
        run: |
          git config user.name "Fishing Project"
          git config user.email "actions@users.noreply.github.com"
          git add pwa/gear-app.js pwa/index.html pwa/apply-authored-notes.mjs pwa/apply-local-media.mjs pwa/build.mjs pwa/image-validation.mjs
          git commit -m "Support sibling Notes images and explicit picture replacement"
          git push origin HEAD:feature/gear-guides-ordered-links
