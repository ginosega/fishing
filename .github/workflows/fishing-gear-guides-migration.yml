name: Fishing Gear Guides migration
on:
  push:
    branches:
      - feature/gear-guides-ordered-links
    paths:
      - '.github/workflows/fishing-gear-guides-migration.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gear-guides-ordered-links
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finalize validated release source and documentation
        run: |
          node pwa/finalize-gear-guides-release.mjs
          node pwa/finalize-gear-guides-tests.mjs
          node --check pwa/gear-app.js
          node pwa/gear-media-policy.test.mjs
          node pwa/gear-model.test.mjs
          node pwa/my-gear-routing.test.mjs
          node pwa/kb-model.test.mjs
          node pwa/kb-routing.test.mjs
          node pwa/final-content.test.mjs
      - name: Commit validated source
        run: |
          git config user.name "Fishing Project"
          git config user.email "actions@users.noreply.github.com"
          git add README.md Fishing_Context.md Fishing_TODO.md Fishing_Decision_Log.md Fishing_New_Chat_Bootstrap_Prompt.md pwa/README.md pwa/gear-app.js pwa/my-gear-routing.test.mjs
          git commit -m "Finalize Gear Guides release and durable state"
          git push origin HEAD:feature/gear-guides-ordered-links
