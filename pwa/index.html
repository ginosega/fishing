<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b3d3a" />
  <meta name="description" content="Offline-first front end for the Fishing knowledge base." />
  <title>Fishing Companion</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
  <style>
    /* Keep the image viewer inside the actually visible mobile browser viewport. */
    @media (max-width: 720px) {
      .media-modal {
        inset: auto;
        top: 0;
        left: 0;
        width: 100vw;
        width: 100dvw;
        height: 100vh;
        height: 100dvh;
        padding:
          max(6px, env(safe-area-inset-top))
          max(6px, env(safe-area-inset-right))
          max(6px, env(safe-area-inset-bottom))
          max(6px, env(safe-area-inset-left));
        align-items: stretch;
        justify-content: stretch;
        overflow: hidden;
      }
      .media-dialog {
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;
        min-height: 0;
        border-radius: 14px;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <button class="icon-button" id="homeButton" type="button" aria-label="Home">🎣</button>
    <div>
      <div class="eyebrow">Fishing knowledge base</div>
      <h1>Fishing Companion</h1>
    </div>
    <div class="status-dot" id="onlineStatus" title="Connection status" aria-label="Connection status"></div>
  </header>

  <main id="app" class="app-shell" aria-live="polite">
    <section class="loading-card">
      <div class="spinner" aria-hidden="true"></div>
      <p>Loading your fishing knowledge…</p>
    </section>
  </main>

  <footer class="app-footer">
    <span id="copyrightFooter"></span>
  </footer>

  <script src="./app.js" type="module"></script>
  <script src="./media-ui.js" type="module"></script>
  <script src="./link-ui.js" type="module"></script>
  <script type="module">
    const MODEL_OVERRIDES = new Map([
      ['VMC Redline Weedless Wacky Neko', 'VMC / Redline Weedless Wacky Neko'],
      ['VMC Crossover Rings', 'VMC / Crossover rings'],
      ['Gamakatsu G-Finesse Drop Shot Hook', 'Gamakatsu / G-Finesse Drop Shot Hook'],
      ['Gamakatsu EWG Worm Offset Hook, NS Black', 'Gamakatsu / EWG Worm Offset Hook'],
      ['Generic #0 inline spinner assortment', 'Generic / #0 inline spinner assortment'],
      ['Generic #1 inline spinner', 'Generic / #1 inline spinner'],
      ['Kastmaster', 'Acme / Kastmaster']
    ]);

    const companionApp = document.querySelector('#app');
    let companionFixQueued = false;

    if (companionApp) {
      new MutationObserver(queueCompanionFixes).observe(companionApp, { childList: true, subtree: true });
      window.addEventListener('hashchange', queueCompanionFixes);
      queueCompanionFixes();
    }

    function queueCompanionFixes() {
      if (companionFixQueued) return;
      companionFixQueued = true;
      requestAnimationFrame(() => {
        companionFixQueued = false;
        applyModelOverride();
        applyDickNiteGuidance();
      });
    }

    function applyModelOverride() {
      if (!location.hash.startsWith('#/inventory/item/')) return;
      const title = document.querySelector('.section-title h2')?.textContent?.trim() || '';
      const replacement = MODEL_OVERRIDES.get(title);
      if (!replacement) return;
      const cell = findDetailCell('Manufacturer / Model');
      const value = cell?.querySelector('.value');
      if (value && value.textContent.trim() !== replacement) value.textContent = replacement;
    }

    function applyDickNiteGuidance() {
      if (!location.hash.startsWith('#/inventory/item/')) return;
      const title = document.querySelector('.section-title h2')?.textContent?.trim() || '';
      if (title !== 'Dick Nite spoon') return;

      const knotPanel = findPanel('Knots & connections');
      if (knotPanel && !knotPanel.querySelector('[data-dick-nite-rigging]')) {
        const note = document.createElement('div');
        note.className = 'recommendation';
        note.dataset.dickNiteRigging = 'true';
        note.innerHTML = '<div class="guidance-body"><p>Rig with split rings at top and bottom, and single hook at bottom with point toward the concave side of the spoon.</p></div>';
        knotPanel.append(note);
      }

      let usePanel = findPanel('How to use it');
      if (!usePanel) {
        usePanel = document.createElement('section');
        usePanel.className = 'panel';
        usePanel.innerHTML = '<h3>How to use it</h3>';
        const catchPanel = findPanel('My catch history');
        if (catchPanel) catchPanel.before(usePanel);
        else document.querySelector('#app')?.append(usePanel);
      }
      if (!usePanel.querySelector('[data-dick-nite-use]')) {
        const note = document.createElement('div');
        note.className = 'recommendation';
        note.dataset.dickNiteUse = 'true';
        note.innerHTML = '<h4>Use</h4><div class="guidance-body"><p>Fish it with a bit of nightcrawler or PowerBait egg on the hook.</p></div>';
        usePanel.append(note);
      }
    }

    function findDetailCell(label) {
      const wanted = normalizeLabel(label);
      return [...document.querySelectorAll('.detail-cell')].find(cell => normalizeLabel(cell.querySelector('.label')?.textContent) === wanted) || null;
    }

    function findPanel(heading) {
      const wanted = normalizeLabel(heading);
      return [...document.querySelectorAll('.panel')].find(panel => {
        const h = panel.querySelector(':scope > h2, :scope > h3');
        return normalizeLabel(h?.textContent) === wanted;
      }) || null;
    }

    function normalizeLabel(value = '') {
      return String(value).toLowerCase().replace(/[^a-z0-9]+/g, ' ').replace(/\s+/g, ' ').trim();
    }
  </script>
  <script>
    document.addEventListener('click', event => {
      const route = event.target.closest('[data-route]');
      if (route) {
        event.preventDefault();
        location.hash = route.dataset.route;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      const item = event.target.closest('[data-item-open]');
      if (item) {
        event.preventDefault();
        location.hash = '#/inventory/item/' + encodeURIComponent(item.dataset.itemOpen);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });
  </script>
</body>
</html>
