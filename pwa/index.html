<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b3d3a" />
  <meta name="description" content="Offline-first fishing gear, knowledge, and catch companion." />
  <title>Fishing Companion</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
  <style>
    .category-card-icon { width: 34px; height: 34px; display: grid; place-items: center; line-height: 1; }
    .category-card-icon svg { width: 34px; height: 34px; display: block; }
    .page-actions { margin: 18px 0 4px; padding-top: 12px; border-top: 1px solid var(--border); }
    .text-action, .link-button { display: inline-flex; align-items: center; gap: 6px; border: 0; padding: 6px 0; background: transparent; color: #8ee5c8; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
    .text-action:hover, .link-button:hover { text-decoration: underline; }
    .gear-editor { display: grid; gap: 0; }
    .gear-editor textarea { font: inherit; resize: vertical; }
    .form-panel { overflow: visible; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
    .form-field { min-width: 0; }
    .field-label { display: block; margin: 0 0 6px; color: #dce7e3; font-size: .88rem; font-weight: 700; }
    .form-help { margin-top: 6px; color: var(--muted); font-size: .78rem; line-height: 1.4; }
    .read-only-input { opacity: .62; cursor: not-allowed; background: #0d211f; }
    .disabled-section { opacity: .68; }
    .form-section-title { display: flex; justify-content: space-between; gap: 12px; align-items: start; margin-bottom: 10px; }
    .form-section-title h3 { margin: 0; }
    .form-section-title p { margin: 4px 0 0; color: var(--muted); font-size: .86rem; }
    .repeater { display: grid; gap: 9px; }
    .repeater-row { display: grid; gap: 8px; align-items: center; }
    .specification-row { grid-template-columns: minmax(120px,.7fr) minmax(180px,1.3fr) 42px; }
    .link-row { grid-template-columns: minmax(130px,.7fr) minmax(200px,1.3fr) 42px; }
    .repeater-row .select { width: 100%; min-width: 0; }
    .remove-row-button { width: 42px; min-height: 42px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--muted); font: inherit; font-size: 1.3rem; cursor: pointer; }
    .remove-row-button:hover { color: var(--danger); border-color: rgba(255,141,134,.45); }
    .choice-fieldset { margin: 0; padding: 0; border: 0; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    .choice-fieldset legend { width: 100%; margin-bottom: 8px; color: #dce7e3; font-size: .92rem; font-weight: 800; }
    .choice-fieldset label { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
    .choice-fieldset input[type="radio"] { width: 18px; height: 18px; accent-color: var(--accent); }
    #replacementPictureFields { margin-top: 12px; }
    .current-state-note a { overflow-wrap: anywhere; }
    .current-state-note { margin: 10px 0 0; color: var(--muted); font-size: .82rem; }
    .current-state-note code, .prepared-change code { overflow-wrap: anywhere; }
    #pictureFields, #notesFields { margin-top: 14px; }
    .markdown-editor { min-height: 220px; line-height: 1.5; }
    .inline-actions { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .markdown-preview { margin-top: 12px; background: rgba(255,255,255,.02); }
    .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin: 14px 0 4px; flex-wrap: wrap; }
    .form-errors { margin-bottom: 14px; padding: 12px 14px; border: 1px solid rgba(255,141,134,.4); border-radius: 12px; background: rgba(255,141,134,.08); color: #ffd1cd; }
    .form-errors strong { color: #ffe6e3; }
    .form-errors ul { margin: 7px 0 0; padding-left: 20px; }
    .prepared-change { margin-top: 22px; border-color: rgba(98,213,176,.4); }
    .prepared-change > p:first-of-type { color: var(--muted); }
    .handoff-package { min-height: 300px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace !important; font-size: .82rem; line-height: 1.45; }
    .copy-status { color: var(--muted); font-size: .85rem; }

    @media (max-width: 720px) {
      .media-modal {
        inset: auto;
        top: 0;
        left: 0;
        width: 100vw;
        width: 100dvw;
        height: 100vh;
        height: 100dvh;
        padding:
          max(6px, env(safe-area-inset-top))
          max(6px, env(safe-area-inset-right))
          max(6px, env(safe-area-inset-bottom))
          max(6px, env(safe-area-inset-left));
        align-items: stretch;
        justify-content: stretch;
        overflow: hidden;
      }
      .media-dialog {
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;
        min-height: 0;
        border-radius: 14px;
      }
      .form-grid { grid-template-columns: 1fr; }
      .specification-row { grid-template-columns: 1fr 42px; }
      .specification-row [data-spec-label], .specification-row [data-spec-value] { grid-column: 1; }
      .specification-row .remove-row-button { grid-column: 2; grid-row: 1 / span 2; }
      .link-row { grid-template-columns: 1fr 42px; }
      .link-row [data-link-kind], .link-row [data-link-label], .link-row [data-link-url] { grid-column: 1; }
      .link-row .remove-row-button { grid-column: 2; grid-row: 1 / span 3; }
    }
    @media (max-width: 420px) {
      .form-actions > button { flex: 1 1 100%; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <button class="icon-button" id="homeButton" type="button" aria-label="Home">🎣</button>
    <div>
      <h1>Fishing Companion</h1>
    </div>
    <div class="status-dot" id="onlineStatus" title="Connection status" aria-label="Connection status"></div>
  </header>

  <main id="app" class="app-shell" aria-live="polite">
    <section class="loading-card">
      <div class="spinner" aria-hidden="true"></div>
      <p>Loading your fishing knowledge…</p>
    </section>
  </main>

  <footer class="app-footer">
    <span id="copyrightFooter"></span>
  </footer>

  <script src="./gear-app.js" type="module"></script>
  <script src="./kb-app.js" type="module"></script>
  <script src="./media-ui.js" type="module"></script>
  <script>
    document.addEventListener('click', event => {
      const route = event.target.closest('[data-route]');
      if (route) {
        event.preventDefault();
        location.hash = route.dataset.route;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      const item = event.target.closest('[data-item-open]');
      if (item) {
        event.preventDefault();
        location.hash = '#/inventory/item/' + encodeURIComponent(item.dataset.itemOpen);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });
  </script>
</body>
</html>
